<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>认字中 · 学习乐园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="literacy.css?v=2">
</head>
<body class="lit-body lit-play-body">

<div class="lit-wrap lit-play-wrap">

  <!-- 极简: 顶部只显示进度 + 计分 + 计时 -->
  <div class="lit-play-topbar">
    <div class="lit-play-meta-item"><span class="lit-play-meta-label">题目</span><span><span id="qIndex">1</span> / <span id="qTotal">10</span></span></div>
    <div class="lit-play-meta-item lit-play-correct">✅ <span id="correctScore">0</span></div>
    <div class="lit-play-meta-item lit-play-wrong">❌ <span id="wrongScore">0</span></div>
    <div class="lit-play-meta-item">⏱️ <span class="lit-play-timer" id="timer">00:00</span></div>
  </div>

  <div class="lit-progress-bar"><div class="lit-progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="lit-play-mode" id="modeLabel">📚 全量作答</div>

  <!-- 极简: 大字 + 对错 (无提示文字) -->
  <main class="lit-play-stage">
    <div class="lit-play-char" id="qChar">字</div>
  </main>

  <div class="lit-play-actions">
    <button class="lit-btn-judge lit-btn-wrong" id="btnWrong" type="button">❌ 错</button>
    <button class="lit-btn-judge lit-btn-correct" id="btnCorrect" type="button">✅ 对</button>
  </div>

  <p class="lit-cta-help" style="text-align:center;color:var(--text2);font-size:12px;margin-top:8px">
    ← 错 · → 对 · 空格 对 · 退格 错 · <a href="index.html" style="color:var(--c-pink)">回主页</a>
  </p>

</div>

<script src="../shared/learn-shared.js?v=1"></script>
<script src="literacy.js?v=2" defer></script>
</body>
</html>
