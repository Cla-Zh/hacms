<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>认字中 · 学习乐园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="literacy.css?v=1">
</head>
<body class="lit-body">

<div class="lit-wrap">

  <header class="lit-header">
    <a href="index.html" class="lit-back" aria-label="返回主页">← 返回</a>
    <h1 class="lit-title">📖 认字中</h1>
    <p class="lit-sub">让宝宝读出字, 家长点击下面 "对" 或 "错" 评分</p>
  </header>

  <div class="lit-topbar">
    <div class="lit-stats">
      <div class="lit-stat">📝 <span id="qIndex">1</span> / <span id="qTotal">10</span></div>
    </div>
    <div class="lit-stats">
      <div class="lit-stat">⏱️ <span class="lit-play-timer" id="timer">00:00</span></div>
    </div>
  </div>

  <div class="lit-progress-bar"><div class="lit-progress-fill" id="progressFill" style="width:0%"></div></div>

  <main class="lit-card">
    <div class="lit-play-question" id="qChar">字</div>
    <p class="lit-play-hint" id="feedback">让宝宝认读这个字</p>
  </main>

  <div class="lit-play-actions">
    <button class="lit-btn-judge lit-btn-wrong" id="btnWrong" type="button">❌ 错</button>
    <button class="lit-btn-judge lit-btn-correct" id="btnCorrect" type="button">✅ 对</button>
  </div>

  <p class="lit-cta-help" style="text-align:center;color:var(--text2);font-size:12px;margin-top:8px">键盘快捷键: ← 错 · → 对</p>

</div>

<script src="../shared/learn-shared.js?v=1"></script>
<script src="literacy.js?v=1" defer></script>
</body>
</html>
