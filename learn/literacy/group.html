<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>集合详情 · 认字识字</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="literacy.css?v=3">
</head>
<body class="lit-body">

<div class="lit-wrap">

  <header class="lit-group-header" id="groupHeader">
    <a href="index.html" class="lit-back">← 返回</a>
    <div class="lit-gh-icon" id="groupIcon">📚</div>
    <h1 class="lit-gh-name" id="groupName">字表集合</h1>
    <p class="lit-gh-sub" id="groupSub">点下面 "🎯 开始练习" 让宝宝认字</p>
  </header>

  <!-- 顶部统计 -->
  <div class="lit-summary">
    <div class="lit-sum-item"><div class="lit-sum-num" id="gTotal">0</div><div class="lit-sum-label">字</div></div>
    <div class="lit-sum-item"><div class="lit-sum-num" id="gLearned">0</div><div class="lit-sum-label">已练过</div></div>
    <div class="lit-sum-item lit-sum-good"><div class="lit-sum-num" id="gMastered">0</div><div class="lit-sum-label">已掌握</div></div>
    <div class="lit-sum-item lit-sum-bad"><div class="lit-sum-num" id="gWrong">0</div><div class="lit-sum-label">有错字</div></div>
  </div>

  <!-- 主操作 -->
  <div class="lit-mode-switch lit-mode-switch-large">
    <button class="lit-mode-btn active" id="btnStart" type="button">
      <div class="lit-mode-icon">🎯</div>
      <div class="lit-mode-text">开始练习</div>
      <div class="lit-mode-sub">从所有字中随机</div>
    </button>
    <button class="lit-mode-btn" id="btnStartWrong" type="button">
      <div class="lit-mode-icon">❌</div>
      <div class="lit-mode-text">只练错字</div>
      <div class="lit-mode-sub">复习宝宝错的</div>
    </button>
  </div>

  <!-- 工具栏 -->
  <div class="lit-toolbar">
    <div class="lit-toolbar-group">
      <button class="lit-tb-btn" id="btnEdit" type="button">✏️ 编辑集合</button>
      <button class="lit-tb-btn" id="btnExportXml" type="button">📤 导出 XML</button>
      <button class="lit-tb-btn lit-tb-danger" id="btnDelete" type="button">🗑️ 删除集合</button>
    </div>
  </div>

  <!-- 字列表 -->
  <main class="lit-card">
    <h3 class="lit-block-title">📖 集合字表 (每字统计)</h3>
    <ul class="lit-wordlist" id="charList"></ul>
  </main>

  <!-- 错字排行 -->
  <details class="lit-details">
    <summary>❌ 错字排行</summary>
    <div class="lit-stats-detail" id="wrongList"></div>
  </details>

  <!-- 答题历史 -->
  <details class="lit-details">
    <summary>📜 最近 10 次答题记录</summary>
    <div class="lit-stats-detail" id="roundsList"></div>
  </details>

  <!-- 底部 -->
  <div class="lit-edit-entry">
    <a class="lit-btn lit-btn-secondary" href="index.html">← 返回集合列表</a>
  </div>

</div>

<script src="../shared/learn-shared.js?v=1"></script>
<script src="literacy.js?v=3" defer></script>
</body>
</html>
