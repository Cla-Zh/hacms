<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>认字识字 · 学习乐园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="literacy.css?v=3">
</head>
<body class="lit-body">

<div class="lit-wrap">

  <header class="lit-header">
    <a href="../" class="lit-back">← 返回</a>
    <h1 class="lit-title">📚 字表集合</h1>
    <p class="lit-sub">每个集合一组字 · 独立练习 · 独立统计</p>
  </header>

  <!-- 顶部统计 -->
  <div class="lit-summary">
    <div class="lit-sum-item"><div class="lit-sum-num" id="totalGroups">0</div><div class="lit-sum-label">集合</div></div>
    <div class="lit-sum-item"><div class="lit-sum-num" id="totalWords">0</div><div class="lit-sum-label">总字数</div></div>
    <div class="lit-sum-item lit-sum-good"><div class="lit-sum-num" id="totalMastered">0</div><div class="lit-sum-label">已掌握</div></div>
    <div class="lit-sum-item lit-sum-bad"><div class="lit-sum-num" id="totalWrong">0</div><div class="lit-sum-label">有错字</div></div>
    <div class="lit-sum-item"><div class="lit-sum-num" id="totalLearned">0</div><div class="lit-sum-label">已练过</div></div>
  </div>

  <!-- 操作 -->
  <div class="lit-toolbar">
    <div class="lit-toolbar-group">
      <button class="lit-tb-btn lit-tb-good" id="btnNewGroup" type="button">➕ 新建字表集合</button>
      <button class="lit-tb-btn" id="btnImportGroups" type="button">📥 导入集合</button>
      <input type="file" id="importGroupsFile" accept=".xml,application/xml" style="display:none">
    </div>
  </div>

  <!-- 集合列表 -->
  <main class="lit-groups-wrap" id="groupList"></main>

  <div class="lit-empty" id="emptyState" style="display:none">
    <div class="lit-empty-emoji">📚</div>
    <div class="lit-empty-title">还没有字表集合</div>
    <div class="lit-empty-sub">点上方 "➕ 新建字表集合" 开始</div>
  </div>

</div>

<script src="../shared/learn-shared.js?v=1"></script>
<script src="literacy.js?v=3" defer></script>
</body>
</html>
