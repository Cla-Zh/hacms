<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>认字识字 · 学习乐园</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="literacy.css?v=1">
</head>
<body class="lit-body">

<div class="lit-wrap">

  <header class="lit-header">
    <a href="../" class="lit-back" aria-label="返回学习乐园">← 返回</a>
    <h1 class="lit-title">📖 认字识字</h1>
    <p class="lit-sub">家长编辑字表, 宝宝认读, 家长判对错</p>
  </header>

  <div class="lit-topbar">
    <div class="lit-stats">
      <div class="lit-stat">📚 当前 <span class="lit-stat-num" id="wordCount">0</span> 个字</div>
    </div>
    <div class="lit-actions">
      <button class="lit-btn lit-btn-secondary" id="resetBtn" type="button">🔄 恢复默认</button>
      <a class="lit-btn lit-btn-edit" href="edit.html">✏️ 家长编辑</a>
    </div>
  </div>

  <main class="lit-card">
    <div class="lit-grid" id="wordsGrid"></div>
    <div class="lit-empty" id="emptyState">
      <div class="lit-empty-emoji">📭</div>
      <div class="lit-empty-title">还没有字</div>
      <div class="lit-empty-sub">请家长点右上角 "✏️ 家长编辑" 添加字</div>
    </div>
  </main>

  <div class="lit-cta">
    <button class="lit-btn lit-btn-primary" id="startBtn" type="button">🎯 开始认字</button>
    <p class="lit-cta-help">点击大按钮开始 · 让宝宝读出每个字 · 家长点击 "对/错" 评分</p>
  </div>

</div>

<script src="../shared/learn-shared.js?v=1"></script>
<script src="literacy.js?v=1" defer></script>
</body>
</html>
