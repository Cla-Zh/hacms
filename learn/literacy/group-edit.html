<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>编辑字表集合 · 认字识字</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8D%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="literacy.css?v=3">
</head>
<body class="lit-body">

<div class="lit-wrap">

  <header class="lit-header">
    <a href="index.html" class="lit-back" id="cancelBack">← 取消</a>
    <h1 class="lit-title">✏️ 编辑字表集合</h1>
    <p class="lit-sub">填名称 + 选图标/颜色 + 输入字 / 选预设</p>
  </header>

  <div class="lit-edit-tips">
    💡 <b>使用说明</b>:
    <ul style="margin:6px 0 0 16px;line-height:1.8">
      <li><b>名称</b>: 给集合起名, 例如 "小学一年级"</li>
      <li><b>图标 + 颜色</b>: 视觉区分不同集合</li>
      <li><b>字表</b>: 输入或粘贴字, 自动去重</li>
      <li><b>12 个预设</b>: 点 = 追加, 不覆盖 (可点多个)</li>
      <li><b>保存</b>: 跳到集合详情, 立即可练</li>
    </ul>
  </div>

  <div class="lit-edit-panel">
    <!-- 名称 + ID (隐藏) -->
    <label class="lit-field">
      <span class="lit-field-label">📛 集合名称</span>
      <input type="text" id="groupNameInput" class="lit-field-input" placeholder="例如: 小学一年级 / 动物世界 / 日常用语">
      <input type="hidden" id="groupIdInput">
    </label>

    <!-- 图标 + 颜色 -->
    <div class="lit-field">
      <span class="lit-field-label">🎨 图标 / 颜色</span>
      <div class="lit-pickers">
        <div class="lit-icon-picker" id="iconPicker"></div>
        <div class="lit-color-picker" id="colorPicker"></div>
      </div>
    </div>

    <!-- 预设 -->
    <div class="lit-field">
      <span class="lit-field-label">📚 预设模板 (点击追加)</span>
      <div class="lit-edit-presets" id="presets"></div>
    </div>

    <!-- 字表输入 -->
    <div class="lit-field">
      <span class="lit-field-label">📝 字表 (去重后 <b id="charCount">0</b> 个字)</span>
      <textarea id="wordsTextarea" class="lit-edit-textarea" placeholder="在这里输入字, 例如: 人口手大小山水火日月"></textarea>
      <div class="lit-edit-preview-title" style="margin-top:12px">预览</div>
      <div class="lit-grid" id="preview"></div>
    </div>

    <!-- 操作 -->
    <div class="lit-edit-buttons">
      <button class="lit-btn lit-btn-primary" id="saveBtn" type="button">💾 保存</button>
      <button class="lit-btn lit-btn-secondary" id="cancelBtn" type="button">↩ 取消</button>
    </div>

    <p id="savedHint" style="margin-top:12px;color:var(--c-green);font-weight:700;display:none">✅ 已保存! 即将跳到集合详情...</p>
  </div>

</div>

<script src="../shared/learn-shared.js?v=1"></script>
<script src="literacy.js?v=3" defer></script>
</body>
</html>
