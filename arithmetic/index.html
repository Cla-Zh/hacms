<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算术题 · 肥嘟嘟的炼金工厂</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="arithmetic.css?v=2">
</head>
<body class="arith-body">

<div class="arith-wrap">

  <header class="arith-header">
    <a href="/" class="arith-back" aria-label="返回首页">← 返回</a>
    <h1 class="arith-title">🧮 算术题乐园</h1>
    <p class="arith-sub">小朋友, 选一个难度开始玩吧! · <a href="#history" class="arith-foot-link">📊 我的记录</a></p>
  </header>

  <main class="arith-main">

    <a class="arith-card arith-card-green" href="play.html?max=10">
      <div class="arith-card-emoji">🐰</div>
      <div class="arith-card-title">10 以内加减法</div>
      <div class="arith-card-sub">幼儿园中班</div>
      <div class="arith-card-tag">基础</div>
    </a>

    <a class="arith-card arith-card-yellow" href="play.html?max=20">
      <div class="arith-card-emoji">🦊</div>
      <div class="arith-card-title">20 以内加减法</div>
      <div class="arith-card-sub">幼儿园大班</div>
      <div class="arith-card-tag">进阶</div>
    </a>

    <a class="arith-card arith-card-red" href="play.html?max=100">
      <div class="arith-card-emoji">🦁</div>
      <div class="arith-card-title">100 以内加减法</div>
      <div class="arith-card-sub">小学一年级</div>
      <div class="arith-card-tag">挑战</div>
    </a>

  </main>

  <!-- ========== 📊 答题记录 (localStorage 持久化) ========== -->
  <section class="arith-history" id="history">
    <h2 class="arith-history-title">📊 我的答题记录</h2>

    <div class="arith-history-stats" id="historyStats">
      <!-- JS 动态填充: 总答题/总对/总用时/平均速度 -->
    </div>

    <div class="arith-history-actions">
      <button class="arith-btn-clear" id="btnClearHistory" type="button">🗑️ 清空记录</button>
    </div>

    <div class="arith-history-list" id="historyList">
      <!-- JS 动态填充: 最近 20 条记录 -->
    </div>
  </section>

  <footer class="arith-footer">
    <p>🎈 每次题目都不一样, 答对 10 题自动升级难度, 加油!</p>
  </footer>

</div>

<script src="arithmetic-history.js?v=1" defer></script>
</body>
</html>
