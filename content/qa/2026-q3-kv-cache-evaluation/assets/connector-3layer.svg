<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
<rect x="0" y="0" width="800" height="400" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">vLLM KV Cache 传输: 三层抽象</text>
<rect x="40" y="55" width="720" height="80" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="60" y="82" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">第 1 层: KV Pipe (FIFO 管道)</text>
<text x="60" y="106" font-family="sans-serif" font-size="12" fill="#374151">职责: 传输 torch.tensor · API: send_tensor / recv_tensor</text>
<text x="60" y="124" font-family="sans-serif" font-size="11" fill="#6b7280">可跳过 — 若存储已支持 key-value 查找 (Redis / RDMA 库)</text>
<rect x="40" y="155" width="720" height="80" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="60" y="182" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">第 2 层: KV Lookup Buffer (查找缓冲)</text>
<text x="60" y="206" font-family="sans-serif" font-size="12" fill="#374151">职责: 按键 (token 序列) 查值 · API: insert / drop_select (SQL 语义)</text>
<text x="60" y="224" font-family="sans-serif" font-size="11" fill="#6b7280">解决 prefill 与 decode 处理顺序不一致的问题 · 可跳过</text>
<rect x="40" y="255" width="720" height="80" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="60" y="282" font-family="sans-serif" font-size="15" font-weight="bold" fill="#6d28d9">第 3 层: KV Connector (接入引擎) — 核心, 必须实现</text>
<text x="60" y="306" font-family="sans-serif" font-size="12" fill="#374151">API: send_kv_caches_and_hidden_states / recv_kv_caches_and_hidden_states</text>
<text x="60" y="324" font-family="sans-serif" font-size="11" fill="#6b7280">可直接实现 (改执行流: 部分 token 收 KV + 其余 token prefill), 但随 vLLM 升级易失效</text>
<text x="400" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">已集成: LMCache / Mooncake / NIXL / Offloading connector · v0.9.0+ 支持异步</text>
</svg>