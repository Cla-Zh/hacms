<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
<rect x="0" y="0" width="800" height="360" fill="#ffffff"/>
<text x="400" y="30" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">集群扩展性评估: 强扩展 vs 弱扩展</text>
<rect x="20" y="55" width="360" height="260" rx="8" fill="#faf8ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="200" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">强扩展 (Strong Scaling)</text>
<text x="200" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">固定总负载, 增加节点数</text>
<line x1="60" y1="270" x2="360" y2="270" stroke="#d1d5db" stroke-width="1.5"/>
<line x1="60" y1="270" x2="60" y2="120" stroke="#d1d5db" stroke-width="1.5"/>
<text x="210" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">节点数</text>
<text x="42" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280" transform="rotate(-90 42 200)">加速比</text>
<polyline points="60,270 160,195 260,150 360,120" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
<circle cx="60" cy="270" r="4" fill="#8b5cf6"/>
<circle cx="160" cy="195" r="4" fill="#8b5cf6"/>
<circle cx="260" cy="150" r="4" fill="#8b5cf6"/>
<circle cx="360" cy="120" r="4" fill="#8b5cf6"/>
<text x="360" y="110" text-anchor="end" font-family="sans-serif" font-size="11" fill="#374151">看速度是否线性提升</text>
<rect x="420" y="55" width="360" height="260" rx="8" fill="#faf8ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="600" y="82" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6d28d9">弱扩展 (Weak Scaling) ★ 关键</text>
<text x="600" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#374151">固定每节点负载, 增加节点数</text>
<line x1="460" y1="270" x2="760" y2="270" stroke="#d1d5db" stroke-width="1.5"/>
<line x1="460" y1="270" x2="460" y2="120" stroke="#d1d5db" stroke-width="1.5"/>
<text x="610" y="292" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">节点数</text>
<text x="442" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280" transform="rotate(-90 442 200)">总吞吐</text>
<polyline points="460,270 535,195 610,120 685,45 760,-30" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="6 4"/>
<circle cx="460" cy="270" r="4" fill="#8b5cf6"/>
<circle cx="535" cy="195" r="4" fill="#8b5cf6"/>
<circle cx="610" cy="120" r="4" fill="#8b5cf6"/>
<text x="760" y="50" text-anchor="end" font-family="sans-serif" font-size="11" fill="#374151">理想: 线性增长无拐点</text>
<text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">弱扩展尤其关键: KV Cache 收益来自跨请求复用, 请求量随规模线性增长</text>
</svg>