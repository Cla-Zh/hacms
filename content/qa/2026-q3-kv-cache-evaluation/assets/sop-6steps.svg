<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
<rect x="0" y="0" width="800" height="200" fill="#ffffff"/>
<text x="400" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">KV Cache 插件评估: 6 步 SOP</text>
<rect x="10" y="55" width="110" height="70" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="65" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">1. 基线</text>
<text x="65" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">关插件测</text>
<rect x="140" y="55" width="110" height="70" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="195" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">2. 微基准</text>
<text x="195" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">单操作延迟</text>
<rect x="270" y="55" width="110" height="70" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="325" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">3. 端到端</text>
<text x="325" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">真实 trace</text>
<rect x="400" y="55" width="110" height="70" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="455" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">4. 负载测试</text>
<text x="455" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">吞吐-延迟曲线</text>
<rect x="530" y="55" width="110" height="70" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
<text x="585" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">5. 质量回归</text>
<text x="585" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">SCBench</text>
<rect x="660" y="55" width="110" height="70" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
<text x="715" y="82" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#6d28d9">6. 成本</text>
<text x="715" y="100" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6b7280">$ per token</text>
<line x1="120" y1="90" x2="140" y2="90" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr4)"/>
<line x1="250" y1="90" x2="270" y2="90" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr4)"/>
<line x1="380" y1="90" x2="400" y2="90" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr4)"/>
<line x1="510" y1="90" x2="530" y2="90" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr4)"/>
<line x1="640" y1="90" x2="660" y2="90" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arr4)"/>
<defs>
<marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker>
</defs>
<text x="400" y="160" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">Load Testing (模拟并发) 与 Performance Benchmarking (测效率) 要结合 (NVIDIA)</text>
</svg>