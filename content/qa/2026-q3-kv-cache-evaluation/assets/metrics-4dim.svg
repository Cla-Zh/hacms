<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
<rect x="0" y="0" width="800" height="340" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a">KV Cache 系统评估: 4 维指标体系</text>
<rect x="20" y="60" width="180" height="250" rx="8" fill="#faf8ff" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="20" y="60" width="180" height="34" rx="8" fill="#8b5cf6"/>
<text x="110" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🎯 用户感知</text>
<text x="35" y="118" font-family="sans-serif" font-size="13" fill="#374151">TTFT (首 token)</text>
<text x="35" y="142" font-family="sans-serif" font-size="13" fill="#374151">TPOT / ITL</text>
<text x="35" y="166" font-family="sans-serif" font-size="13" fill="#374151">E2E 延迟</text>
<text x="35" y="190" font-family="sans-serif" font-size="13" fill="#374151">P99 长尾</text>
<text x="35" y="230" font-family="sans-serif" font-size="11" fill="#6b7280">缓存命中→跳过</text>
<text x="35" y="248" font-family="sans-serif" font-size="11" fill="#6b7280">prefill, 砍 TTFT</text>
<rect x="220" y="60" width="180" height="250" rx="8" fill="#faf8ff" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="220" y="60" width="180" height="34" rx="8" fill="#6d28d9"/>
<text x="310" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🚀 系统吞吐</text>
<text x="235" y="118" font-family="sans-serif" font-size="13" fill="#374151">System TPS</text>
<text x="235" y="142" font-family="sans-serif" font-size="13" fill="#374151">User TPS</text>
<text x="235" y="166" font-family="sans-serif" font-size="13" fill="#374151">RPS</text>
<text x="235" y="230" font-family="sans-serif" font-size="11" fill="#6b7280">同一硬件稳态</text>
<text x="235" y="248" font-family="sans-serif" font-size="11" fill="#6b7280">吞吐是否变高</text>
<rect x="420" y="60" width="180" height="250" rx="8" fill="#faf8ff" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="420" y="60" width="180" height="34" rx="8" fill="#8b5cf6"/>
<text x="510" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">🧠 缓存专属</text>
<text x="435" y="118" font-family="sans-serif" font-size="13" fill="#374151">命中率 (hit rate)</text>
<text x="435" y="142" font-family="sans-serif" font-size="13" fill="#374151">复用率</text>
<text x="435" y="166" font-family="sans-serif" font-size="13" fill="#374151">prefill 时间</text>
<text x="435" y="190" font-family="sans-serif" font-size="13" fill="#374151">KV usage %</text>
<text x="435" y="230" font-family="sans-serif" font-size="11" fill="#6b7280">缓存"值不值钱"</text>
<text x="435" y="248" font-family="sans-serif" font-size="11" fill="#6b7280">的上限</text>
<rect x="620" y="60" width="180" height="250" rx="8" fill="#faf8ff" stroke="#8b5cf6" stroke-width="1.5"/>
<rect x="620" y="60" width="180" height="34" rx="8" fill="#6d28d9"/>
<text x="710" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">💰 成本</text>
<text x="635" y="118" font-family="sans-serif" font-size="13" fill="#374151">GPU 利用率</text>
<text x="635" y="142" font-family="sans-serif" font-size="13" fill="#374151">$ per 1M tokens</text>
<text x="635" y="166" font-family="sans-serif" font-size="13" fill="#374151">存储开销</text>
<text x="635" y="190" font-family="sans-serif" font-size="13" fill="#374151">网络开销</text>
<text x="635" y="230" font-family="sans-serif" font-size="11" fill="#6b7280">最终"省不省钱"</text>
<text x="635" y="248" font-family="sans-serif" font-size="11" fill="#6b7280">的判据</text>
<text x="400" y="330" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b7280">价值 = 命中率 × 命中收益 − 失配代价 − 系统开销</text>
</svg>