<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif"><rect width="800" height="460" fill="#fff"/><text x="400" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">CXL 协议演进时间线（3.0 / 3.1 / 3.2 / 4.0）</text><text x="400" y="44" text-anchor="middle" font-size="10" fill="#525252">Compute Express Link · 从内存池化到 Fabric 极端扩展 · 整机一段到 4.0 128 GT/s</text><line x1="60" y1="120" x2="740" y2="120" stroke="#0a0a0a" stroke-width="2"/><circle cx="100" cy="120" r="11" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1.5"/><text x="100" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">1</text><text x="100" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">CXL 3.0</text><text x="100" y="95" text-anchor="middle" font-size="10" fill="#525252">2022-08</text><text x="100" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">64 GT/s</text><circle cx="310" cy="120" r="11" fill="#3f3f46" stroke="#0a0a0a" stroke-width="1.5"/><text x="310" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">2</text><text x="310" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">CXL 3.1</text><text x="310" y="95" text-anchor="middle" font-size="10" fill="#525252">2023-11</text><text x="310" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">64 GT/s</text><circle cx="520" cy="120" r="11" fill="#525252" stroke="#0a0a0a" stroke-width="1.5"/><text x="520" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">3</text><text x="520" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">CXL 3.2</text><text x="520" y="95" text-anchor="middle" font-size="10" fill="#525252">2025-04</text><text x="520" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">64 GT/s</text><circle cx="700" cy="120" r="11" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1.5"/><text x="700" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">4</text><text x="700" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">CXL 4.0</text><text x="700" y="95" text-anchor="middle" font-size="10" fill="#525252">2026-Q2</text><text x="700" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">128 GT/s</text><rect x="15.0" y="170" width="170" height="200" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.2"/><rect x="15.0" y="170" width="170" height="28" fill="#0a0a0a"/><text x="100.0" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CXL 3.0</text><rect x="25.0" y="211" width="6" height="6" fill="#0a0a0a"/><text x="37.0" y="217" font-size="10" font-weight="700" fill="#0a0a0a">Fabric 引入</text><rect x="25.0" y="233" width="6" height="6" fill="#0a0a0a"/><text x="37.0" y="239" font-size="10" font-weight="700" fill="#0a0a0a">Memory Pooling</text><rect x="25.0" y="255" width="6" height="6" fill="#0a0a0a"/><text x="37.0" y="261" font-size="10" font-weight="700" fill="#0a0a0a">3 层 fabric</text><text x="25.0" y="298" font-size="8" fill="#525252">首次引入 Fabric；多级交换；</text><text x="25.0" y="312" font-size="8" fill="#525252">Memory Pooling 成为可能；</text><text x="25.0" y="326" font-size="8" fill="#525252">64 GT/s (PCIe 5.0 PHY)。</text><rect x="225.0" y="170" width="170" height="200" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.2"/><rect x="225.0" y="170" width="170" height="28" fill="#3f3f46"/><text x="310.0" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CXL 3.1</text><rect x="235.0" y="211" width="6" height="6" fill="#0a0a0a"/><text x="247.0" y="217" font-size="10" font-weight="700" fill="#0a0a0a">TSID/ID 扩展</text><rect x="235.0" y="233" width="6" height="6" fill="#0a0a0a"/><text x="247.0" y="239" font-size="10" font-weight="700" fill="#0a0a0a">TEE/IDE 加密</text><rect x="235.0" y="255" width="6" height="6" fill="#0a0a0a"/><text x="247.0" y="261" font-size="10" font-weight="700" fill="#0a0a0a">可信连接</text><text x="235.0" y="298" font-size="8" fill="#525252">扩展 TSID/ID 空间；</text><text x="235.0" y="312" font-size="8" fill="#525252">TEE/IDE 加密；</text><text x="235.0" y="326" font-size="8" fill="#525252">CXL IDE 设备认证。</text><rect x="435.0" y="170" width="170" height="200" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.2"/><rect x="435.0" y="170" width="170" height="28" fill="#525252"/><text x="520.0" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CXL 3.2</text><rect x="445.0" y="211" width="6" height="6" fill="#0a0a0a"/><text x="457.0" y="217" font-size="10" font-weight="700" fill="#0a0a0a">Port-Based Routing</text><rect x="445.0" y="233" width="6" height="6" fill="#0a0a0a"/><text x="457.0" y="239" font-size="10" font-weight="700" fill="#0a0a0a">Tunnel 增强</text><rect x="445.0" y="255" width="6" height="6" fill="#0a0a0a"/><text x="457.0" y="261" font-size="10" font-weight="700" fill="#0a0a0a">共享内存</text><text x="445.0" y="298" font-size="8" fill="#525252">Tunnel 协议增强；</text><text x="445.0" y="312" font-size="8" fill="#525252">Port-Based Routing；</text><text x="445.0" y="326" font-size="8" fill="#525252">shared memory 语义。</text><rect x="615.0" y="170" width="170" height="200" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.2"/><rect x="615.0" y="170" width="170" height="28" fill="#0a0a0a"/><text x="700.0" y="189" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CXL 4.0</text><rect x="625.0" y="211" width="6" height="6" fill="#0a0a0a"/><text x="637.0" y="217" font-size="10" font-weight="700" fill="#0a0a0a">PAM4 翻倍</text><rect x="625.0" y="233" width="6" height="6" fill="#0a0a0a"/><text x="637.0" y="239" font-size="10" font-weight="700" fill="#0a0a0a">Fabric 8K 节点</text><rect x="625.0" y="255" width="6" height="6" fill="#0a0a0a"/><text x="637.0" y="261" font-size="10" font-weight="700" fill="#0a0a0a">PCIe 6 PHY</text><text x="625.0" y="298" font-size="8" fill="#525252">128 GT/s (PCIe 6.0 PAM4)；</text><text x="625.0" y="312" font-size="8" fill="#525252">Fabric 8K 节点；</text><text x="625.0" y="326" font-size="8" fill="#525252">内存迁移/快照。</text><text x="400" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">3.0 确立 Fabric  →  3.1 保安全  →  3.2 强路由  →  4.0 翻倍带宽</text><text x="400" y="416" text-anchor="middle" font-size="9" fill="#525252">CXL 4.0 内存池化可用于 KV Cache 跨 socket 共享 · 与 NVLink 6 + UALink 并行不悖</text><text x="400" y="432" text-anchor="middle" font-size="9" fill="#525252">来源：CXL 3.0/3.1/3.2 规范 (computeexpresslink.org) · CXL 4.0 0.5 草案</text><text x="400" y="448" text-anchor="middle" font-size="9" fill="#525252">注：PCIe 7.0 物理层 (128 GT/s) 为 2026 预期；CXL 4.0 采用 PAM4 同步升级</text></svg>