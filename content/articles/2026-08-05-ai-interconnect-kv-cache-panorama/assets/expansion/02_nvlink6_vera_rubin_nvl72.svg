<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">NVLink 6 + Vera Rubin NVL72 72 GPU 单机柜拓扑</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#525252">18 计算托盘 × 4 GPU · NVSwitch 6 全互连 · 单机柜 72 GPU · 双向 130 TB/s</text>

<!-- 顶部图例 -->
<g font-size="10" fill="#525252">
  <rect x="80" y="62" width="14" height="14" fill="#0a0a0a"/><text x="100" y="73">Vera Rubin GPU</text>
  <rect x="220" y="62" width="14" height="14" fill="#3f3f46"/><text x="240" y="73">NVSwitch 6 交换</text>
  <rect x="360" y="62" width="14" height="14" fill="#a3a3a3"/><text x="380" y="73">计算托盘 (4 GPU)</text>
  <rect x="510" y="62" width="14" height="14" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/><text x="530" y="73">CPU 节点 (Grace)</text>
  <rect x="640" y="62" width="14" height="14" fill="#fff" stroke="#525252" stroke-width="0.7" stroke-dasharray="3 2"/><text x="660" y="73">NVLink 6 连接</text>
</g>

<!-- 机柜外框 -->
<rect x="40" y="90" width="720" height="290" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.5"/>
<text x="50" y="108" font-size="11" font-weight="700" fill="#0a0a0a">NVL72 单机柜（19 英寸 × 48U 视图俯视）</text>

<!-- 左侧 CPU/系统域 -->
<g>
  <rect x="55" y="120" width="80" height="250" fill="#fff" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="95" y="138" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">CPU 域</text>
  <text x="95" y="152" text-anchor="middle" font-size="8" fill="#525252">Grace × 18</text>
  <rect x="62" y="162" width="66" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="95" y="177" text-anchor="middle" font-size="8" fill="#0a0a0a">Grace LPDDR5</text>
  <rect x="62" y="190" width="66" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="95" y="205" text-anchor="middle" font-size="8" fill="#0a0a0a">Grace LPDDR5</text>
  <rect x="62" y="218" width="66" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="95" y="233" text-anchor="middle" font-size="8" fill="#0a0a0a">Grace LPDDR5</text>
  <rect x="62" y="290" width="66" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="95" y="305" text-anchor="middle" font-size="8" fill="#0a0a0a">NIC/BMC</text>
  <text x="95" y="350" text-anchor="middle" font-size="8" fill="#525252">至托盘: NVLink-C2C</text>
</g>

<!-- 中间 NVSwitch 6 交换域 -->
<g>
  <rect x="160" y="120" width="460" height="250" fill="#3f3f46" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="390" y="138" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">NVSwitch 6 全互连层</text>
  <text x="390" y="152" text-anchor="middle" font-size="9" fill="#d4d4d4">9 颗 NVSwitch 6 · 双向 130 TB/s · 全网状 GPU 直连</text>
  <!-- 9 颗 NVSwitch 排成一排 -->
  <rect x="180" y="170" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="204" y="192" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw0</text>
  <rect x="234" y="170" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="258" y="192" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw1</text>
  <rect x="288" y="170" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="312" y="192" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw2</text>
  <rect x="342" y="170" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="366" y="192" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw3</text>
  <rect x="396" y="170" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="420" y="192" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw4</text>
  <rect x="450" y="170" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="474" y="192" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw5</text>
  <rect x="504" y="170" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="528" y="192" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw6</text>
  <rect x="558" y="170" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="582" y="192" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw7</text>
  <line x1="204" y1="206" x2="582" y2="206" stroke="#fff" stroke-width="0.7"/>
  <!-- 第二排 -->
  <rect x="234" y="218" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="258" y="240" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw8</text>
  <rect x="288" y="218" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="312" y="240" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw9</text>
  <rect x="342" y="218" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="366" y="240" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw10</text>
  <rect x="396" y="218" width="48" height="36" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="420" y="240" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">NVSw11</text>
  <text x="390" y="290" text-anchor="middle" font-size="9" fill="#d4d4d4">每 GPU 直连 18 端口 NVLink 6</text>
  <text x="390" y="304" text-anchor="middle" font-size="9" fill="#d4d4d4">单端口 100 GB/s · 总聚合 1.8 TB/s/GPU</text>
  <text x="390" y="330" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">整柜双向 130 TB/s 池化</text>
  <text x="390" y="350" text-anchor="middle" font-size="9" fill="#d4d4d4">1.8 TB/s/GPU × 72 GPU</text>
</g>

