<!-- 底部参数 -->
<g>
  <rect x="40" y="395" width="720" height="50" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="60" y="412" font-size="10" font-weight="700" fill="#0a0a0a">整柜规格</text>
  <text x="60" y="430" font-size="9" fill="#525252">72 × Vera Rubin GPU</text>
  <text x="200" y="430" font-size="9" fill="#525252">HBM4 内存</text>
  <text x="320" y="412" font-size="10" font-weight="700" fill="#0a0a0a">卡间</text>
  <text x="320" y="430" font-size="9" fill="#525252">NVLink 6 100 GB/s/port</text>
  <text x="500" y="412" font-size="10" font-weight="700" fill="#0a0a0a">总带宽</text>
  <text x="500" y="430" font-size="9" fill="#525252">130 TB/s 双向</text>
  <text x="660" y="430" font-size="9" fill="#525252">扩展 ConnectX-8</text>
</g>
