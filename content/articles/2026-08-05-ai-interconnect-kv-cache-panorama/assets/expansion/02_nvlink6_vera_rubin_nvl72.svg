  <rect x="719" y="261" width="18" height="14" fill="#0a0a0a"/>
  <text x="728" y="271" text-anchor="middle" font-size="6" fill="#fff">G15</text>

  <rect x="640" y="287" width="105" height="38" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="692" y="300" text-anchor="middle" font-size="8" fill="#0a0a0a" font-weight="700">托盘 5</text>
  <rect x="650" y="304" width="18" height="14" fill="#0a0a0a"/>
  <text x="659" y="314" text-anchor="middle" font-size="6" fill="#fff">G16</text>
