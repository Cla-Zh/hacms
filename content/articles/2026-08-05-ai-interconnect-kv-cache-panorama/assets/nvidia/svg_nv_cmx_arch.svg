<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">CMX 内部架构（G3.5 内存层级 · 单个 Enclosure）</text>
<text x="400" y="46" text-anchor="middle" font-size="11" fill="#525252">4 × BlueField-4 DPU + NVMe Flash + Spectrum-X 互联 · 150 TB / 16 TB-per-GPU</text>

<!-- 左侧: GPU 计算节点 (左侧 4 张 GPU 卡示意) -->
<g>
  <text x="120" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">Rubin GPU 计算节点</text>
  <rect x="30" y="100" width="180" height="200" fill="#fafafa" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="50" y="120" width="140" height="60" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="120" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Rubin HBM4</text>
  <text x="120" y="163" text-anchor="middle" font-size="10" fill="#fff">288 GB · 22 TB/s</text>
  <rect x="50" y="190" width="140" height="40" fill="#fff" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="120" y="205" text-anchor="middle" font-size="9" fill="#0a0a0a">Host DRAM</text>
  <text x="120" y="220" text-anchor="middle" font-size="9" fill="#0a0a0a">80 GB · 800 GB/s</text>
  <rect x="50" y="240" width="140" height="40" fill="#fff" stroke="#a3a3a3" stroke-width="0.7"/>
  <text x="120" y="255" text-anchor="middle" font-size="9" fill="#525252">Local NVMe (G3)</text>
  <text x="120" y="270" text-anchor="middle" font-size="9" fill="#525252">10-50 μs</text>
  <text x="120" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">单 GPU 分配 16 TB</text>
</g>

<!-- 中间: Spectrum-X Switch -->
<g>
  <rect x="240" y="190" width="80" height="80" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="1.5"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">Spectrum-X</text>
  <text x="280" y="234" text-anchor="middle" font-size="10" fill="#0a0a0a">SN6800</text>
  <text x="280" y="250" text-anchor="middle" font-size="9" fill="#0a0a0a">409.6 Tb/s</text>
  <text x="280" y="292" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">200 Gb/s CPO</text>
</g>

<!-- 右侧: CMX Enclosure (4× BlueField-4 + 150 TB NVMe) -->
<g>
  <text x="540" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">CMX Enclosure（单柜）</text>
  <rect x="370" y="100" width="380" height="280" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.5"/>

  <!-- 4 个 BlueField-4 DPU 横向排列 -->
  <g>
    <rect x="385" y="120" width="80" height="80" fill="#3f3f46" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="425" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">BlueField-4</text>
    <text x="425" y="158" text-anchor="middle" font-size="9" fill="#fff">#1</text>
    <text x="425" y="173" text-anchor="middle" font-size="8" fill="#fff">64 核 Grace</text>
    <text x="425" y="188" text-anchor="middle" font-size="8" fill="#fff">128 GB LPDDR5X</text>

    <rect x="475" y="120" width="80" height="80" fill="#3f3f46" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="515" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">BlueField-4</text>
    <text x="515" y="158" text-anchor="middle" font-size="9" fill="#fff">#2</text>
    <text x="515" y="173" text-anchor="middle" font-size="8" fill="#fff">64 核 Grace</text>
    <text x="515" y="188" text-anchor="middle" font-size="8" fill="#fff">128 GB LPDDR5X</text>

    <rect x="565" y="120" width="80" height="80" fill="#3f3f46" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="605" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">BlueField-4</text>
    <text x="605" y="158" text-anchor="middle" font-size="9" fill="#fff">#3</text>
    <text x="605" y="173" text-anchor="middle" font-size="8" fill="#fff">64 核 Grace</text>
    <text x="605" y="188" text-anchor="middle" font-size="8" fill="#fff">128 GB LPDDR5X</text>

    <rect x="655" y="120" width="80" height="80" fill="#3f3f46" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="695" y="143" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">BlueField-4</text>
    <text x="695" y="158" text-anchor="middle" font-size="9" fill="#fff">#4</text>
    <text x="695" y="173" text-anchor="middle" font-size="8" fill="#fff">64 核 Grace</text>
    <text x="695" y="188" text-anchor="middle" font-size="8" fill="#fff">128 GB LPDDR5X</text>
  </g>

  <!-- 中段: NVMe Flash 阵列 -->
  <g>
    <rect x="385" y="220" width="350" height="80" fill="#fff" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="560" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">NVMe Flash 阵列</text>
    <text x="560" y="256" text-anchor="middle" font-size="10" fill="#0a0a0a">总容量 150 TB</text>
    <text x="560" y="272" text-anchor="middle" font-size="9" fill="#525252">AES-XTS 800Gb/s · DOCA Memos SDK</text>
    <text x="560" y="288" text-anchor="middle" font-size="9" fill="#525252">128 字节 KV Block 粒度</text>
  </g>

  <!-- 底部: Spectrum-X 上行 -->
  <g>
    <rect x="385" y="320" width="350" height="40" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="560" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">Spectrum-X 200 Gb/s CPO 上行 · 端到端 200-500 μs</text>
  </g>
</g>

<!-- 底部说明 -->
<text x="400" y="412" text-anchor="middle" font-size="10" fill="#0a0a0a">解读：CMX 不是「更快的 SSD」，而是「AI 原生的 KV Cache 共享层」</text>
<text x="400" y="430" text-anchor="middle" font-size="9" fill="#525252">DOCA Memos 暴露 KV 语义 API · 4 × BlueField-4 共同管理 150 TB Flash · 16 TB/GPU 软配额</text>
<text x="400" y="448" text-anchor="middle" font-size="9" fill="#525252">来源：NVIDIA GTC 2026 Keynote（Jensen Huang CES 2026 实测数据）</text>
</svg>