<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">Vera Rubin POD 五层架构（NVIDIA 2026-03 GTC）</text>
<text x="400" y="46" text-anchor="middle" font-size="11" fill="#525252">Spectrum-X CPO 后端 + Spectrum-6 SPX 前端 + BlueField-4 STX 存储 + NVL144 计算 + Groq 3 LPX 推理</text>

<!-- 顶部图例 -->
<g font-size="10" fill="#525252">
  <rect x="40" y="60" width="14" height="14" fill="#0a0a0a"/><text x="60" y="71">计算节点</text>
  <rect x="140" y="60" width="14" height="14" fill="#3f3f46"/><text x="160" y="71">存储节点</text>
  <rect x="240" y="60" width="14" height="14" fill="#a3a3a3"/><text x="260" y="71">网络交换</text>
  <rect x="340" y="60" width="14" height="14" fill="#d4d4d4" stroke="#0a0a0a" stroke-width="0.5"/><text x="360" y="71">推理加速</text>
  <rect x="450" y="60" width="14" height="14" fill="#fff" stroke="#0a0a0a" stroke-width="0.5" stroke-dasharray="2 2"/><text x="470" y="71">CPU 通用</text>
</g>

<!-- 左：4 racks Spectrum-X CPO 后端 -->
<g>
  <rect x="40" y="100" width="120" height="320" fill="#fafafa" stroke="#0a0a0a" stroke-width="1"/>
  <text x="100" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">Spectrum-X CPO</text>
  <text x="100" y="132" text-anchor="middle" font-size="9" fill="#525252">后端 RDMA Fabric</text>
  <rect x="55" y="150" width="90" height="42" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="100" y="172" text-anchor="middle" font-size="9" fill="#0a0a0a">Spectrum-4</text>
  <text x="100" y="184" text-anchor="middle" font-size="8" fill="#0a0a0a">SN5610</text>
  <rect x="55" y="200" width="90" height="42" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="100" y="222" text-anchor="middle" font-size="9" fill="#0a0a0a">Spectrum-6</text>
  <text x="100" y="234" text-anchor="middle" font-size="8" fill="#0a0a0a">SPX 102.4T</text>
  <rect x="55" y="250" width="90" height="42" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="100" y="272" text-anchor="middle" font-size="9" fill="#0a0a0a">Spectrum-6</text>
  <text x="100" y="284" text-anchor="middle" font-size="8" fill="#0a0a0a">SPX 102.4T</text>
  <rect x="55" y="300" width="90" height="42" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="100" y="322" text-anchor="middle" font-size="9" fill="#0a0a0a">Spectrum-6</text>
  <text x="100" y="334" text-anchor="middle" font-size="8" fill="#0a0a0a">SPX 102.4T</text>
  <text x="100" y="365" text-anchor="middle" font-size="9" font-weight="700" fill="#0a0a0a">512×200G CPO</text>
  <text x="100" y="382" text-anchor="middle" font-size="9" fill="#525252">同 POD 互联</text>
</g>

<!-- 中：8 racks VR200 NVL144 -->
<g>
  <rect x="180" y="100" width="280" height="320" fill="#fafafa" stroke="#0a0a0a" stroke-width="1"/>
  <text x="320" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">VR200 NVL144 × 8 racks</text>
  <text x="320" y="132" text-anchor="middle" font-size="9" fill="#525252">NVIDIA 旗舰计算域 · 144 GPU/rack · Rubin HBM4</text>

  <!-- 4x2 rack grid -->
  <g>
    <rect x="195" y="150" width="60" height="80" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="225" y="180" text-anchor="middle" font-size="9" fill="#fff">NVL144</text>
    <text x="225" y="195" text-anchor="middle" font-size="8" fill="#fff">#1</text>
    <text x="225" y="212" text-anchor="middle" font-size="8" fill="#fff">144×R</text>

    <rect x="265" y="150" width="60" height="80" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="295" y="180" text-anchor="middle" font-size="9" fill="#fff">NVL144</text>
    <text x="295" y="195" text-anchor="middle" font-size="8" fill="#fff">#2</text>
    <text x="295" y="212" text-anchor="middle" font-size="8" fill="#fff">144×R</text>

    <rect x="335" y="150" width="60" height="80" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="365" y="180" text-anchor="middle" font-size="9" fill="#fff">NVL144</text>
    <text x="365" y="195" text-anchor="middle" font-size="8" fill="#fff">#3</text>
    <text x="365" y="212" text-anchor="middle" font-size="8" fill="#fff">144×R</text>

    <rect x="405" y="150" width="40" height="80" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="425" y="180" text-anchor="middle" font-size="9" fill="#fff">N</text>
    <text x="425" y="195" text-anchor="middle" font-size="8" fill="#fff">#4</text>

    <text x="225" y="250" text-anchor="middle" font-size="8" fill="#525252">Rubin 50PF</text>
    <text x="295" y="250" text-anchor="middle" font-size="8" fill="#525252">HBM4 288GB</text>
    <text x="365" y="250" text-anchor="middle" font-size="8" fill="#525252">NVLink 6 3.6T</text>
    <text x="425" y="250" text-anchor="middle" font-size="8" fill="#525252">SPX 互联</text>
  </g>

  <!-- 中段: Groq 3 LPX 256 LPUs -->
  <g>
    <rect x="195" y="270" width="250" height="42" fill="#d4d4d4" stroke="#0a0a0a" stroke-width="0.7"/>
    <text x="320" y="290" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">Groq 3 LPX 256 LPUs/rack</text>
    <text x="320" y="305" text-anchor="middle" font-size="9" fill="#525252">超低延迟推理 · 32 计算 trays × 8 LPUs</text>
  </g>

  <!-- 中段: Vera CPU 256 / rack -->
  <g>
    <rect x="195" y="320" width="250" height="42" fill="#fff" stroke="#0a0a0a" stroke-width="0.7" stroke-dasharray="3 2"/>
    <text x="320" y="340" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">Vera CPU 256/rack</text>
    <text x="320" y="355" text-anchor="middle" font-size="9" fill="#525252">88 核 · 1.5TB LPDDR5X · 1.2TB/s · 大规模 RL 沙盒</text>
  </g>

  <!-- 底部合计 -->
  <text x="320" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">POD 合计：8 × NVL144 = 1,152 × Rubin GPU</text>
</g>

<!-- 右: 1 rack Spectrum-X CPO + CMX enclosures -->
<g>
  <rect x="480" y="100" width="280" height="320" fill="#fafafa" stroke="#0a0a0a" stroke-width="1"/>
  <text x="620" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">Spectrum-X + CMX 存储 rack</text>
  <text x="620" y="132" text-anchor="middle" font-size="9" fill="#525252">前端 AI-Optimized RDMA Fabric</text>

  <!-- 顶部: Spectrum-X switches -->
  <rect x="495" y="150" width="84" height="60" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="537" y="172" text-anchor="middle" font-size="9" fill="#0a0a0a">Spectrum-X</text>
  <text x="537" y="186" text-anchor="middle" font-size="8" fill="#0a0a0a">CPO 交换机</text>
  <text x="537" y="200" text-anchor="middle" font-size="8" fill="#525252">200 Gb/s</text>

  <rect x="495" y="240" width="84" height="60" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="537" y="262" text-anchor="middle" font-size="9" fill="#0a0a0a">Spectrum-X</text>
  <text x="537" y="276" text-anchor="middle" font-size="8" fill="#0a0a0a">CPO 交换机</text>
  <text x="537" y="290" text-anchor="middle" font-size="8" fill="#525252">200 Gb/s</text>

  <!-- 右侧: CMX enclosures (4 个, 每柜 150TB) -->
  <rect x="595" y="150" width="155" height="60" fill="#3f3f46" stroke="#0a0a0a" stroke-width="1"/>
  <text x="672" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">CMX Enclosure #1</text>
  <text x="672" y="186" text-anchor="middle" font-size="8" fill="#fff">4 × BlueField-4</text>
  <text x="672" y="200" text-anchor="middle" font-size="8" fill="#fff">150 TB NVMe Flash</text>

  <rect x="595" y="220" width="155" height="60" fill="#3f3f46" stroke="#0a0a0a" stroke-width="1"/>
  <text x="672" y="242" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">CMX Enclosure #2</text>
  <text x="672" y="256" text-anchor="middle" font-size="8" fill="#fff">4 × BlueField-4</text>
  <text x="672" y="270" text-anchor="middle" font-size="8" fill="#fff">150 TB NVMe Flash</text>

  <rect x="595" y="290" width="155" height="60" fill="#3f3f46" stroke="#0a0a0a" stroke-width="1"/>
  <text x="672" y="312" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">CMX Enclosure #3-4</text>
  <text x="672" y="326" text-anchor="middle" font-size="8" fill="#fff">8 × BlueField-4</text>
  <text x="672" y="340" text-anchor="middle" font-size="8" fill="#fff">300 TB NVMe Flash</text>

  <!-- 底部合计 -->
  <text x="620" y="380" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">单 GPU 分配：16 TB</text>
  <text x="620" y="397" text-anchor="middle" font-size="9" fill="#525252">CMX 总槽位 = 600 TB+ / POD</text>
</g>

<!-- 底部图例说明 -->
<text x="40" y="445" font-size="9" fill="#525252">数据来源：NVIDIA GTC 2026 Keynote + NVIDIA Vera Rubin POD 官方博客（2026-03）。</text>
<text x="760" y="445" text-anchor="end" font-size="9" fill="#525252">CMX = 128 字节块粒度的 KV Cache 共享层</text>
</svg>