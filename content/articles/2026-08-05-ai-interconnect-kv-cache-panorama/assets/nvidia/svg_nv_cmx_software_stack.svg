<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">CMX 软件栈四层（Dynamo · NIXL · Grove · DOCA Memos）</text>
<text x="400" y="46" text-anchor="middle" font-size="11" fill="#525252">从上到下：AI serving → KV 块迁移 → 拓扑感知调度 → 存储抽象 API</text>

<!-- 5 层堆叠 -->
<g>
  <!-- 代码层 -->
  <rect x="60" y="80" width="680" height="50" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">应用层 · vLLM / SGLang / Dynamo serving</text>
  <text x="400" y="120" text-anchor="middle" font-size="10" fill="#fff">推理框架 · 接收请求 → KV cache 调度</text>

  <!-- Dynamo -->
  <rect x="60" y="140" width="680" height="48" fill="#3f3f46" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">NV-Dynamo · 推理编排</text>
  <text x="400" y="177" text-anchor="middle" font-size="9" fill="#fff">KV-aware placement · prefill/decode 分离 · KV block manager</text>

  <!-- NIXL -->
  <rect x="60" y="198" width="680" height="48" fill="#52525b" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">NIXL · NVIDIA Inference Transfer Library</text>
  <text x="400" y="235" text-anchor="middle" font-size="9" fill="#fff">跨设备 KV 块迁移 · HBM ↔ DRAM ↔ CMX ↔ G4 · 128 字节粒度</text>

  <!-- Grove -->
  <rect x="60" y="256" width="680" height="48" fill="#71717a" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Grove · 拓扑感知调度</text>
  <text x="400" y="293" text-anchor="middle" font-size="9" fill="#fff">workload 跨 rack 调度时保持 KV locality · 复用跨节点 context</text>

  <!-- DOCA Memos -->
  <rect x="60" y="314" width="680" height="48" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="334" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">DOCA Memos · KV 语义 API + 加密</text>
  <text x="400" y="351" text-anchor="middle" font-size="9" fill="#0a0a0a">硬件加速 AES-XTS · 800 Gb/s · 暴露 key-value 给上层</text>

  <!-- 硬件 -->
  <rect x="60" y="372" width="680" height="48" fill="#d4d4d8" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="392" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">硬件 · BlueField-4 + Spectrum-X SN6800/SN5610 + NVMe Flash</text>
  <text x="400" y="409" text-anchor="middle" font-size="9" fill="#525252">单柜 4×BF4 + 150 TB NVMe · 集群 8 racks = 1,152 GPU / 600 TB CMX</text>
</g>

<!-- 右侧箭头 / 流程 -->
<g>
  <path d="M 700 110 L 715 110 L 715 400 L 700 400" fill="none" stroke="#525252" stroke-width="0.7" stroke-dasharray="2 2"/>
  <text x="725" y="250" font-size="9" fill="#525252" transform="rotate(90 725 250)">数据下沉路径</text>
</g>

<!-- 底部 -->
<text x="400" y="442" text-anchor="middle" font-size="9" fill="#525252">来源：NVIDIA GTC 2026 Keynote + Dynamo Developer Blog</text>
</svg>