<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">G1 → G5 内存层级金字塔（CMX 嵌入 G3.5）</text>
<text x="400" y="46" text-anchor="middle" font-size="11" fill="#525252">从上到下：延迟递增 / 容量递增 / 单价递减 · CMX 新增 G3.5 层填补 200-500 μs 空白</text>

<!-- 金字塔 5 层 -->
<g>
  <!-- G1: HBM -->
  <polygon points="350,80 450,80 470,120 330,120" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">G1 · HBM</text>
  <text x="400" y="114" text-anchor="middle" font-size="9" fill="#fff">~500 ns · 288 GB/GPU</text>

  <!-- G2: Host DRAM -->
  <polygon points="320,125 480,125 500,165 300,165" fill="#3f3f46" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">G2 · Host DRAM</text>
  <text x="400" y="159" text-anchor="middle" font-size="9" fill="#fff">~80 ns · 80 GB · 800 GB/s</text>

  <!-- G3: Local NVMe -->
  <polygon points="290,170 510,170 530,210 270,210" fill="#71717a" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">G3 · Local NVMe</text>
  <text x="400" y="204" text-anchor="middle" font-size="9" fill="#fff">10-50 μs · 4-16 TB</text>

  <!-- G3.5: CMX ★ -->
  <polygon points="260,215 540,215 560,260 240,260" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="2"/>
  <text x="400" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">G3.5 · CMX (新)</text>
  <text x="400" y="251" text-anchor="middle" font-size="9" fill="#0a0a0a">200-500 μs · 16 TB/GPU · 共享</text>

  <!-- G4: 企业存储 -->
  <polygon points="230,265 570,265 590,310 210,310" fill="#d4d4d8" stroke="#0a0a0a" stroke-width="1"/>
  <text x="400" y="287" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">G4 · 企业存储</text>
  <text x="400" y="301" text-anchor="middle" font-size="9" fill="#0a0a0a">ms-秒 · 100+ TB · VAST/WEKA</text>

  <!-- G5: Object Storage -->
  <polygon points="200,315 600,315 620,355 180,355" fill="#fafafa" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="400" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#0a0a0a">G5 · Object Storage</text>
  <text x="400" y="349" text-anchor="middle" font-size="9" fill="#525252">秒级 · PB 级 · 冷数据归档</text>
</g>

<!-- 左侧: 延迟刻度 -->
<g font-size="9" fill="#525252">
  <line x1="120" y1="80" x2="140" y2="80" stroke="#525252"/>
  <text x="115" y="83" text-anchor="end">ns</text>
  <line x1="120" y1="125" x2="140" y2="125" stroke="#525252"/>
  <text x="115" y="128" text-anchor="end">ns</text>
  <line x1="120" y1="170" x2="140" y2="170" stroke="#525252"/>
  <text x="115" y="173" text-anchor="end">μs</text>
  <line x1="120" y1="215" x2="140" y2="215" stroke="#525252"/>
  <text x="115" y="218" text-anchor="end">μs</text>
  <line x1="120" y1="265" x2="140" y2="265" stroke="#525252"/>
  <text x="115" y="268" text-anchor="end">ms</text>
  <line x1="120" y1="315" x2="140" y2="315" stroke="#525252"/>
  <text x="115" y="318" text-anchor="end">s</text>
</g>

<!-- 右侧: 容量刻度 -->
<g font-size="9" fill="#525252">
  <text x="640" y="103">GB 级</text>
  <text x="640" y="148">GB 级</text>
  <text x="640" y="193">TB 级</text>
  <text x="640" y="238">×GPU 级</text>
  <text x="640" y="288">TB 级</text>
  <text x="640" y="338">PB 级</text>
</g>

<!-- 关键标注 -->
<g>
  <line x1="540" y1="237" x2="640" y2="237" stroke="#0a0a0a" stroke-width="0.7" stroke-dasharray="2 2"/>
  <text x="645" y="241" font-size="10" font-weight="700" fill="#0a0a0a">★ CMX 填补 G3 和 G4 的鸿沟</text>
</g>

<!-- 底部 -->
<text x="400" y="395" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">CMX 是 NVIDIA 2026 新增的 G3.5 层 — 介于「本地 SSD」和「企业存储」之间</text>
<text x="400" y="412" text-anchor="middle" font-size="9" fill="#525252">来源：NVIDIA CMX 官方产品页 + Developer Blog 2026-03</text>
<text x="400" y="430" text-anchor="middle" font-size="9" fill="#525252">解读：CMX 200-500 μs 比 G3 NVMe 慢 5-10×，但比 G4 企业存储快 1000×，正是 KV Cache 异步预取的甜蜜区</text>
<text x="400" y="448" text-anchor="middle" font-size="9" fill="#525252">5× TPS 提升来源于 cache hit 时 22× 等待时间压缩（65s 重算 → 3s CMX 拉取）</text>
</svg>