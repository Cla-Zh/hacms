<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">华为灵衢 UnifiedBus 全栈四层架构</text>
<text x="400" y="46" text-anchor="middle" font-size="11" fill="#525252">协议层 / 互联层 / 资源抽象层 / 业务使能层 · 一次握手 全域直达</text>

<!-- 顶部图例 -->
<g font-size="10" fill="#525252">
  <rect x="60" y="60" width="14" height="14" fill="#0a0a0a"/><text x="80" y="71">协议层</text>
  <rect x="160" y="60" width="14" height="14" fill="#3f3f46"/><text x="180" y="71">互联层</text>
  <rect x="260" y="60" width="14" height="14" fill="#a3a3a3"/><text x="280" y="71">资源抽象层</text>
  <rect x="380" y="60" width="14" height="14" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/><text x="400" y="71">业务使能层</text>
  <rect x="500" y="60" width="14" height="14" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="2 2"/><text x="520" y="71">跨域语义边界</text>
</g>

<!-- Layer 1: 协议层 (top) -->
<g>
  <rect x="40" y="90" width="720" height="74" fill="#0a0a0a" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="110" font-size="11" font-weight="700" fill="#fff">L1 协议层</text>
  <text x="60" y="124" font-size="9" fill="#d4d4d4">UBC 1.0 统一总线协议 · CXL 3.1 子集 · PCIe 6.0 子集 · 自研 Cache Coherent</text>
  <rect x="200" y="135" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="250" y="150" text-anchor="middle" font-size="9" fill="#0a0a0a">UBC 1.0</text>
  <rect x="320" y="135" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="370" y="150" text-anchor="middle" font-size="9" fill="#0a0a0a">CXL 3.1</text>
  <rect x="440" y="135" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="490" y="150" text-anchor="middle" font-size="9" fill="#0a0a0a">PCIe 6.0</text>
  <rect x="560" y="135" width="120" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="620" y="150" text-anchor="middle" font-size="9" fill="#0a0a0a">MMIO / DMA</text>
</g>

<!-- Layer 2: 互联层 -->
<g>
  <rect x="40" y="178" width="720" height="74" fill="#3f3f46" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="198" font-size="11" font-weight="700" fill="#fff">L2 互联层</text>
  <text x="60" y="212" font-size="9" fill="#d4d4d4">光互连 · 200G/400G SerDes · 自研 HCCD/HCCS · 跨节点内存语义</text>
  <rect x="200" y="223" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="250" y="238" text-anchor="middle" font-size="9" fill="#0a0a0a">HCCD 1.0</text>
  <rect x="320" y="223" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="370" y="238" text-anchor="middle" font-size="9" fill="#0a0a0a">HCCS 2.0</text>
  <rect x="440" y="223" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="490" y="238" text-anchor="middle" font-size="9" fill="#0a0a0a">RoCE v2</text>
  <rect x="560" y="223" width="120" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="620" y="238" text-anchor="middle" font-size="9" fill="#0a0a0a">光模块 OSFP</text>
</g>

<!-- Layer 3: 资源抽象层 -->
<g>
  <rect x="40" y="266" width="720" height="74" fill="#a3a3a3" stroke="#0a0a0a" stroke-width="1"/>
  <text x="60" y="286" font-size="11" font-weight="700" fill="#0a0a0a">L3 资源抽象层</text>
  <text x="60" y="300" font-size="9" fill="#0a0a0a">NUMA 域划分 · 远端内存映射 · 共享 KV-Cache 池 · 设备发现与拓扑</text>
  <rect x="200" y="311" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="250" y="326" text-anchor="middle" font-size="9" fill="#0a0a0a">RMEM 远存</text>
  <rect x="320" y="311" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="370" y="326" text-anchor="middle" font-size="9" fill="#0a0a0a">KV-Cache 池</text>
  <rect x="440" y="311" width="100" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="490" y="326" text-anchor="middle" font-size="9" fill="#0a0a0a">NUMA 域</text>
  <rect x="560" y="311" width="120" height="22" fill="#fff" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="620" y="326" text-anchor="middle" font-size="9" fill="#0a0a0a">拓扑发现</text>
</g>

<!-- Layer 4: 业务使能层 -->
<g>
  <rect x="40" y="354" width="720" height="74" fill="#fff" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="60" y="374" font-size="11" font-weight="700" fill="#0a0a0a">L4 业务使能层</text>
  <text x="60" y="388" font-size="9" fill="#525252">MindSpeed · MindIE · 异构调度 · 一次握手跨域内存语义</text>
  <rect x="200" y="399" width="100" height="22" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="250" y="414" text-anchor="middle" font-size="9" fill="#0a0a0a">MindSpeed</text>
  <rect x="320" y="399" width="100" height="22" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="370" y="414" text-anchor="middle" font-size="9" fill="#0a0a0a">MindIE 推理</text>
  <rect x="440" y="399" width="100" height="22" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="490" y="414" text-anchor="middle" font-size="9" fill="#0a0a0a">异构调度</text>
  <rect x="560" y="399" width="120" height="22" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.5"/>
  <text x="620" y="414" text-anchor="middle" font-size="9" fill="#0a0a0a">KV 直达 API</text>
</g>

<!-- 左侧特性轴 -->
<g font-size="9" fill="#525252">
  <text x="20" y="120" text-anchor="middle">协议</text>
  <text x="20" y="208" text-anchor="middle">物理</text>
  <text x="20" y="296" text-anchor="middle">资源</text>
  <text x="20" y="384" text-anchor="middle">应用</text>
  <line x1="30" y1="90" x2="30" y2="428" stroke="#525252" stroke-width="0.7"/>
</g>

<!-- 底部说明 -->
<text x="400" y="450" text-anchor="middle" font-size="9" fill="#525252">特性: 一次握手跨域直连 · 内存语义统一 · 对外仅暴露 KV-Cache 直达 API, 屏蔽 PCIe/CXL 细节</text>
</svg>
