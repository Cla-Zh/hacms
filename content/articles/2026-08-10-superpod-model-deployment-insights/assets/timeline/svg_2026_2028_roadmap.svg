<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="460" fill="#0a0e1a"/>
<text x="460" y="32" text-anchor="middle" fill="#e8ecf5" font-size="20" font-weight="700">S24 · 2026-2028 关键时间线 — 5 大硬件路线</text>
<text x="460" y="54" text-anchor="middle" fill="#aab2cf" font-size="12">NVIDIA / 华为 / Google / 国产芯片 路线图 (官方公告为锚点)</text>
<line x1="80" y1="200" x2="860" y2="200" stroke="#2a3556" stroke-width="2"/>
<g font-size="10" fill="#6e7798" text-anchor="middle">
<text x="100" y="225">2025 Q4</text>
<text x="220" y="225">2026 H1</text>
<text x="340" y="225">2026 H2</text>
<text x="460" y="225">2026 Q4</text>
<text x="580" y="225">2027 H1</text>
<text x="700" y="225">2027 H2</text>
<text x="820" y="225">2028</text>
</g>
<!-- NVIDIA timeline (top) -->
<g transform="translate(60,90)">
<text x="0" y="0" fill="#7eb6ff" font-size="12" font-weight="700">NVIDIA</text>
<line x1="0" y1="20" x2="800" y2="20" stroke="#7eb6ff" stroke-width="2"/>
<circle cx="280" cy="20" r="7" fill="#7eb6ff"/>
<text x="280" y="50" text-anchor="middle" fill="#7eb6ff" font-size="10">Vera Rubin</text>
<text x="280" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">NVL72 3.6 EFLOPS</text>
<text x="280" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2026 H2</text>
<circle cx="450" cy="20" r="7" fill="#7eb6ff"/>
<text x="450" y="50" text-anchor="middle" fill="#7eb6ff" font-size="10">Rubin CPX</text>
<text x="450" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">NVL144 长文推理</text>
<text x="450" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2026 末</text>
<circle cx="700" cy="20" r="7" fill="#7eb6ff"/>
<text x="700" y="50" text-anchor="middle" fill="#7eb6ff" font-size="10">Rubin Ultra</text>
<text x="700" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">NVL576 Kyber 15 EFLOPS</text>
<text x="700" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2027 H2 (600 kW)</text>
<circle cx="820" cy="20" r="9" fill="#ef4444"/>
<text x="820" y="50" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">Feynman</text>
<text x="820" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">A16 1.6nm + CPO</text>
<text x="820" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2028</text>
</g>
<!-- 华为 timeline -->
<g transform="translate(60,180)">
<text x="0" y="0" fill="#ef4444" font-size="12" font-weight="700">华为</text>
<line x1="0" y1="20" x2="800" y2="20" stroke="#ef4444" stroke-width="2"/>
<circle cx="60" cy="20" r="6" fill="#ef4444"/>
<text x="60" y="50" text-anchor="middle" fill="#ef4444" font-size="9">灵衢 2.0</text>
<text x="60" y="62" text-anchor="middle" fill="#aab2cf" font-size="8">2025-09 开源</text>
<circle cx="450" cy="20" r="7" fill="#ef4444"/>
<text x="450" y="50" text-anchor="middle" fill="#ef4444" font-size="10">Atlas 950</text>
<text x="450" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">8,192 NPU 8 EFLOPS</text>
<text x="450" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2026 Q4</text>
<circle cx="710" cy="20" r="7" fill="#ef4444"/>
<text x="710" y="50" text-anchor="middle" fill="#ef4444" font-size="10">Atlas 960</text>
<text x="710" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">15,488 NPU 30 EFLOPS</text>
<text x="710" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2027 Q4</text>
<circle cx="820" cy="20" r="8" fill="#ef4444"/>
<text x="820" y="50" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">Ascend 970</text>
<text x="820" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">8 PFLOPS FP4</text>
<text x="820" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2028 Q4 (估)</text>
</g>
<!-- Google timeline (lower) -->
<g transform="translate(60,270)">
<text x="0" y="0" fill="#10b981" font-size="12" font-weight="700">Google</text>
<line x1="0" y1="20" x2="800" y2="20" stroke="#10b981" stroke-width="2"/>
<circle cx="50" cy="20" r="6" fill="#10b981"/>
<text x="50" y="50" text-anchor="middle" fill="#10b981" font-size="9">Ironwood v7</text>
<text x="50" y="62" text-anchor="middle" fill="#aab2cf" font-size="8">2025-11 GA</text>
<circle cx="120" cy="20" r="6" fill="#10b981"/>
<text x="120" y="50" text-anchor="middle" fill="#10b981" font-size="9">8t Sunfish</text>
<text x="120" y="62" text-anchor="middle" fill="#aab2cf" font-size="8">训练 2nm</text>
<circle cx="180" cy="20" r="6" fill="#10b981"/>
<text x="180" y="50" text-anchor="middle" fill="#10b981" font-size="9">8i Zebrafish</text>
<text x="180" y="62" text-anchor="middle" fill="#aab2cf" font-size="8">推理 2nm</text>
<text x="380" y="20" fill="#aab2cf" font-size="9">2026 (Thomas Kurian Cloud Next 公告)</text>
</g>
<!-- AMD / 国产 (bottom) -->
<g transform="translate(60,340)">
<text x="0" y="0" fill="#a78bfa" font-size="12" font-weight="700">AMD + 国产 (昆仑/寒武纪/壁仞/沐曦)</text>
<line x1="0" y1="20" x2="800" y2="20" stroke="#a78bfa" stroke-width="2"/>
<circle cx="300" cy="20" r="7" fill="#a78bfa"/>
<text x="300" y="50" text-anchor="middle" fill="#a78bfa" font-size="10">Helios 72×</text>
<text x="300" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">MI455X 432 GB HBM4</text>
<text x="300" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2026 H2 出货</text>
<circle cx="580" cy="20" r="6" fill="#a78bfa"/>
<text x="580" y="50" text-anchor="middle" fill="#a78bfa" font-size="10">UALink 2.0</text>
<text x="580" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">GX5000 native</text>
<text x="580" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2027</text>
<circle cx="780" cy="20" r="7" fill="#a78bfa"/>
<text x="780" y="50" text-anchor="middle" fill="#a78bfa" font-size="10">MI500</text>
<text x="780" y="62" text-anchor="middle" fill="#aab2cf" font-size="9">路线</text>
<text x="780" y="74" text-anchor="middle" fill="#aab2cf" font-size="9">2028+</text>
</g>
<text x="460" y="450" text-anchor="middle" fill="#aab2cf" font-size="10" font-style="italic">NVIDIA 1 年 1 代 · 华为 1 年 1 颗 Ascend · Google 2 年 1 代 + 训练推理分离 (业界首次)</text>
</svg>
