<text x="10" y="40" fill="#e8ecf5" font-size="10">1. 和林格尔 86%</text>
<text x="10" y="55" fill="#e8ecf5" font-size="10">2. 乌兰察布 65.9%</text>
<text x="10" y="70" fill="#e8ecf5" font-size="10">3. 阿里张北 >50%</text>
<text x="10" y="85" fill="#e8ecf5" font-size="10">4. 中卫 西部云基地</text>
</g>
<g transform="translate(0,245)">
<rect x="0" y="0" width="200" height="100" fill="#1c2440" stroke="#10b981" rx="4"/>
<text x="10" y="22" fill="#10b981" font-size="11" font-weight="700">电价 (元/度)</text>
<text x="10" y="40" fill="#e8ecf5" font-size="10">1. 和林格尔 0.35 (最低)</text>
<text x="10" y="55" fill="#e8ecf5" font-size="10">2. 乌兰察布 0.26 (低 50%)</text>
<text x="10" y="70" fill="#e8ecf5" font-size="10">3. 西部整体 ≤0.4</text>
<text x="10" y="85" fill="#e8ecf5" font-size="10">4. 京津冀 0.5-0.6</text>
