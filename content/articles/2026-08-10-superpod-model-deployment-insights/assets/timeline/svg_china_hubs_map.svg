<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="460" fill="#0a0e1a"/>
<text x="460" y="32" text-anchor="middle" fill="#e8ecf5" font-size="20" font-weight="700">S21 · 中国 8 大国家算力枢纽 + 9 大数据中心地图</text>
<text x="460" y="54" text-anchor="middle" fill="#aab2cf" font-size="12">"东数西算" 2022-02 启动, 8 枢纽 + 10 集群 (国家发改委批复)</text>
<g transform="translate(100,90)">
