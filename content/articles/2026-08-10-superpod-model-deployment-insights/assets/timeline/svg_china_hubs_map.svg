<text x="10" y="40" fill="#e8ecf5" font-size="10">韶关 (起步期)</text>
<text x="10" y="55" fill="#e8ecf5" font-size="10">深圳/广州 (2025-26)</text>
<text x="10" y="68" fill="#aab2cf" font-size="9">华为南方基地</text>
</g>
<g transform="translate(0,185)">
