<text x="10" y="40" fill="#e8ecf5" font-size="10">和林格尔 (40.40°N)</text>
<text x="10" y="55" fill="#e8ecf5" font-size="10">乌兰察布 (41.04°N)</text>
<text x="10" y="68" fill="#aab2cf" font-size="9">12.5 万 P + 110 万架</text>
</g>
<g transform="translate(0,185)">
<rect x="0" y="0" width="180" height="70" fill="#1c2440" stroke="#7eb6ff" rx="4"/>
<text x="10" y="22" fill="#7eb6ff" font-size="11" font-weight="700">宁夏</text>
<text x="10" y="40" fill="#e8ecf5" font-size="10">中卫 (37.51°N)</text>
<text x="10" y="68" fill="#aab2cf" font-size="9">西部云基地 + 美团/阿里</text>
</g>
<g transform="translate(0,270)">
