<text x="460" y="440" text-anchor="middle" fill="#aab2cf" font-size="10" font-style="italic">"算力尽头就是能源" — 内蒙古 + 张北 + 宁夏 + 贵安 4 大西部枢纽支撑中国大模型时代能源底线</text>
</svg>
