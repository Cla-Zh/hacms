<text x="10" y="40" fill="#e8ecf5" font-size="10">张北 (41.16°N)</text>
<text x="10" y="55" fill="#e8ecf5" font-size="10">廊坊 (39.52°N)</text>
<text x="10" y="68" fill="#aab2cf" font-size="9">8 万卡 + 7,209 PFLOPS</text>
</g>
