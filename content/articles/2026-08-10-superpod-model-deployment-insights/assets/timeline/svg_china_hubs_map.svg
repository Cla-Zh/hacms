<text x="10" y="40" fill="#e8ecf5" font-size="10">1. 华为芜湖 1.10 (液冷)</text>
<text x="10" y="55" fill="#e8ecf5" font-size="10">2. 华为贵安 1.12</text>
<text x="10" y="70" fill="#e8ecf5" font-size="10">3. 阿里张北 1.13-1.25</text>
<text x="10" y="85" fill="#e8ecf5" font-size="10">4. 华为乌兰察布 1.15</text>
