</g>
</g>
<g transform="translate(640,90)">
<text x="0" y="0" fill="#10b981" font-size="13" font-weight="700">核心机房 3 大技术指标</text>
<g transform="translate(0,15)">
<rect x="0" y="0" width="200" height="100" fill="#1c2440" stroke="#10b981" rx="4"/>
