<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="460" fill="#0a0e1a"/>
<text x="460" y="32" text-anchor="middle" fill="#e8ecf5" font-size="20" font-weight="700">S11 · Atlas 950 SuperPoD 8,192 Ascend 950DT — 灵衢 2.0 全光</text>
<text x="460" y="54" text-anchor="middle" fill="#aab2cf" font-size="12">8 EFLOPS FP8 / 256 TB 统一内存 / 2.1 μs 跨柜延迟 (MWC 2026 + HC2025)</text>
<g transform="translate(60,90)">
<rect x="0" y="0" width="800" height="50" fill="#141a2e" stroke="#ef4444" stroke-width="2" rx="6"/>
<text x="20" y="20" fill="#ef4444" font-size="13" font-weight="700">Compute Rack × 128</text>
<text x="20" y="40" fill="#aab2cf" font-size="11">每柜 64 NPU (Ascend 950DT, 144GB HBM, 1 PFLOPS FP8 估)</text>
<g transform="translate(450,15)">
<rect x="0" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="14" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="28" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="42" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="56" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="70" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="84" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="98" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="112" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="126" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="140" y="0" width="10" height="20" fill="#ef4444"/>
<rect x="154" y="0" width="10" height="20" fill="#ef4444"/>
<text x="200" y="14" fill="#aab2cf" font-size="9">×128 racks = 8,192 NPU</text>
</g>
</g>
<g transform="translate(60,150)">
<rect x="0" y="0" width="800" height="40" fill="#141a2e" stroke="#f59e0b" stroke-width="2" rx="6"/>
<text x="20" y="18" fill="#f59e0b" font-size="13" font-weight="700">灵衢 2.0 UB Fabric (全光)</text>
<text x="20" y="34" fill="#aab2cf" font-size="11">UB-Mesh 3D 直连 + 灵衢交换 ASIC + 全光互联 200m, 2.1 μs 跨柜延迟</text>
<text x="600" y="26" fill="#f59e0b" font-size="11" font-weight="700">TB 级带宽/rack</text>
</g>
<g transform="translate(60,200)">
<rect x="0" y="0" width="800" height="50" fill="#141a2e" stroke="#7eb6ff" stroke-width="2" rx="6"/>
<text x="20" y="20" fill="#7eb6ff" font-size="13" font-weight="700">Unified Memory Tier</text>
<text x="20" y="40" fill="#aab2cf" font-size="11">256 TB 全局统一内存编址 (load/store 语义, 跨柜原子操作)</text>
<text x="600" y="30" fill="#7eb6ff" font-size="11" font-weight="700">vs NVL72 13.4 TB ≈ 19×</text>
</g>
<g transform="translate(60,260)">
<text x="0" y="0" fill="#a78bfa" font-size="13" font-weight="700">灵衢 2.0 协议栈 (4 层, 2025-09 华为开源)</text>
<g transform="translate(0,15)">
<rect x="0" y="0" width="180" height="36" fill="#1c2440" stroke="#a78bfa"/>
<text x="90" y="14" text-anchor="middle" fill="#e8ecf5" font-size="10">物理层 (全光 200m)</text>
<text x="90" y="28" text-anchor="middle" fill="#aab2cf" font-size="9">Physical — fiber</text>
</g>
<g transform="translate(190,15)">
<rect x="0" y="0" width="180" height="36" fill="#1c2440" stroke="#a78bfa"/>
<text x="90" y="14" text-anchor="middle" fill="#e8ecf5" font-size="10">数据链路层 (2.1 μs RTT)</text>
<text x="90" y="28" text-anchor="middle" fill="#aab2cf" font-size="9">Data Link</text>
</g>
<g transform="translate(380,15)">
<rect x="0" y="0" width="180" height="36" fill="#1c2440" stroke="#a78bfa"/>
<text x="90" y="14" text-anchor="middle" fill="#e8ecf5" font-size="10">传输层 (UB-Mesh)</text>
<text x="90" y="28" text-anchor="middle" fill="#aab2cf" font-size="9">Transport</text>
</g>
<g transform="translate(570,15)">
<rect x="0" y="0" width="220" height="36" fill="#1c2440" stroke="#a78bfa"/>
<text x="110" y="14" text-anchor="middle" fill="#e8ecf5" font-size="10">语义层 (load/store/原子)</text>
<text x="110" y="28" text-anchor="middle" fill="#aab2cf" font-size="9">Semantic — memory ops</text>
</g>
</g>
<g transform="translate(60,340)">
<text x="0" y="0" fill="#10b981" font-size="13" font-weight="700">Atlas 950 SuperPoD vs NVL72 GB200 横向</text>
<text x="0" y="22" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">规模</tspan>: 8,192 NPU vs 72 GPU — 灵衢领先 scale-up 域 114×</text>
<text x="0" y="40" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">算力</tspan>: 8 EFLOPS FP8 vs 1.44 EFLOPS FP4 稀疏 — 灵衢领先 5.5×</text>
<text x="0" y="58" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">统一内存</tspan>: 256 TB vs 13.4 TB — 灵衢领先 19×</text>
<text x="0" y="76" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">跨柜延迟</tspan>: 2.1 μs vs ~260 TB/s NVLink (单柜内) — 灵衢 跨柜</text>
</g>
<text x="460" y="445" text-anchor="middle" fill="#aab2cf" font-size="10" font-style="italic">Source: 华为 MWC 2026 公告 + HC2025 keynote (徐直军) + UnifiedBus 官网 unifiedbus.com</text>
</svg>
