<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="460" fill="#0a0e1a"/>
<text x="460" y="32" text-anchor="middle" fill="#e8ecf5" font-size="20" font-weight="700">S22 · 4 模型 × 8 维度雷达图对比</text>
<text x="460" y="54" text-anchor="middle" fill="#aab2cf" font-size="12">GLM-4.5 / Qwen 3 / DeepSeek V3 / MiniMax-3 (相对评分 0-10)</text>
<g transform="translate(460,260)">
<g id="radar">
<polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" fill="none" stroke="#3d4a73" stroke-width="1"/>
<polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="#3d4a73" stroke-width="0.5"/>
<polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#3d4a73" stroke-width="0.5"/>
<polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#3d4a73" stroke-width="0.5"/>
<polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#3d4a73" stroke-width="0.5"/>
<line x1="0" y1="-150" x2="0" y2="150" stroke="#3d4a73" stroke-width="0.5"/>
<line x1="-130" y1="-75" x2="130" y2="75" stroke="#3d4a73" stroke-width="0.5"/>
<line x1="130" y1="-75" x2="-130" y2="75" stroke="#3d4a73" stroke-width="0.5"/>
</g>
<text x="0" y="-165" text-anchor="middle" fill="#aab2cf" font-size="11">参数量</text>
<text x="160" y="-75" fill="#aab2cf" font-size="11">训练集群</text>
<text x="160" y="80" fill="#aab2cf" font-size="11">推理价格低</text>
<text x="0" y="170" text-anchor="middle" fill="#aab2cf" font-size="11">上下文</text>
<text x="-160" y="80" text-anchor="middle" fill="#aab2cf" font-size="11">开源</text>
<text x="-160" y="-75" text-anchor="middle" fill="#aab2cf" font-size="11">国产化</text>
<text x="100" y="-30" fill="#aab2cf" font-size="9">多模态</text>
<text x="-160" y="-30" fill="#aab2cf" font-size="9">KV cache</text>
<!-- GLM-4.5 (blue) -->
<polygon points="0,-100 95,-55 80,46 0,90 -110,63 -80,-46 -50,-20" fill="#7eb6ff" fill-opacity="0.2" stroke="#7eb6ff" stroke-width="2"/>
<!-- Qwen 3 (purple) -->
<polygon points="0,-80 130,-75 60,34 0,80 -90,52 -100,-58 -100,-40" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa" stroke-width="2"/>
<!-- DeepSeek V3 (orange) -->
<polygon points="0,-145 80,-46 130,75 0,80 -120,69 -60,-35 -20,-8" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2"/>
<!-- MiniMax-3 (green) -->
<polygon points="0,-130 60,-35 50,29 0,130 -50,29 -40,-23 -90,-35" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
</g>
<g transform="translate(60,400)">
<rect x="0" y="0" width="14" height="14" fill="#7eb6ff" stroke="#fff"/>
<text x="20" y="11" fill="#e8ecf5" font-size="11">GLM-4.5</text>
<rect x="110" y="0" width="14" height="14" fill="#a78bfa" stroke="#fff"/>
<text x="130" y="11" fill="#e8ecf5" font-size="11">Qwen 3-235B</text>
<rect x="240" y="0" width="14" height="14" fill="#f59e0b" stroke="#fff"/>
<text x="260" y="11" fill="#e8ecf5" font-size="11">DeepSeek V3-671B</text>
<rect x="400" y="0" width="14" height="14" fill="#10b981" stroke="#fff"/>
<text x="420" y="11" fill="#e8ecf5" font-size="11">MiniMax-3 (估)</text>
</g>
<text x="460" y="450" text-anchor="middle" fill="#aab2cf" font-size="10" font-style="italic">DeepSeek 在 KV cache + 训练集群 + 价格 3 维度领先, Qwen 在训练集群 + 开源领先, GLM 在国产化领先, MiniMax 在上下文领先</text>
</svg>
