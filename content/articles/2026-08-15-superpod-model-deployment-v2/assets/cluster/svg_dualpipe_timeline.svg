</g>
<g transform="translate(60,300)">
<text x="0" y="0" fill="#10b981" font-size="13" font-weight="700">关键洞察</text>
<text x="0" y="22" fill="#e8ecf5" font-size="11">• A2A 通信 (红+蓝) 完全被另一方向的 MLP/Attn 计算覆盖 — <tspan fill="#10b981" font-weight="700">通信零开销</tspan></text>
<text x="0" y="42" fill="#e8ecf5" font-size="11">• PP comm (青色) 与 B/W (绿色) overlap, bubble 几乎为零</text>
<text x="0" y="62" fill="#e8ecf5" font-size="11">• compute-to-comm ratio ≈ 1:1, 但通过 DualPipe 实现 <tspan fill="#7eb6ff" font-weight="700">近零 EP 通信开销</tspan></text>
<text x="0" y="82" fill="#e8ecf5" font-size="11">• 256 routed + 1 shared expert · top-8 routing · 8 PP ranks · 20 micro-batches</text>
</g>
<text x="460" y="430" text-anchor="middle" fill="#aab2cf" font-size="10" font-style="italic">Source: DeepSeek-V3 paper §3.2.1, arXiv:2412.19437 + github.com/deepseek-ai/DualPipe</text>
</svg>
