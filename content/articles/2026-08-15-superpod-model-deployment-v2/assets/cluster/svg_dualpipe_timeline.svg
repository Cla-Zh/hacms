<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="460" fill="#0a0e1a"/>
<text x="460" y="32" text-anchor="middle" fill="#e8ecf5" font-size="20" font-weight="700">S05 · DeepSeek DualPipe 时间线 — 通信完全隐藏在计算里</text>
<text x="460" y="54" text-anchor="middle" fill="#aab2cf" font-size="12">8 PP ranks × 20 micro-batches 双向流动 (源自 DeepSeek V3 paper Fig.4)</text>
<g transform="translate(60,90)">
<rect x="0" y="0" width="800" height="60" fill="#1c2440" rx="4"/>
<text x="10" y="20" fill="#aab2cf" font-size="10">Component</text>
<rect x="0" y="30" width="100" height="30" fill="#f59e0b" opacity="0.7"/>
<text x="50" y="49" text-anchor="middle" fill="#0a0e1a" font-size="11" font-weight="700">Attn (B/I)</text>
<rect x="100" y="30" width="100" height="30" fill="#ef4444" opacity="0.7"/>
<text x="150" y="49" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">A2A-dispatch</text>
<rect x="200" y="30" width="100" height="30" fill="#a78bfa" opacity="0.7"/>
<text x="250" y="49" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">MLP (B/I)</text>
<rect x="300" y="30" width="100" height="30" fill="#7eb6ff" opacity="0.7"/>
<text x="350" y="49" text-anchor="middle" fill="#0a0e1a" font-size="11" font-weight="700">A2A-combine</text>
<rect x="400" y="30" width="100" height="30" fill="#10b981" opacity="0.7"/>
<text x="450" y="49" text-anchor="middle" fill="#0a0e1a" font-size="11" font-weight="700">B/W (weights)</text>
<rect x="500" y="30" width="100" height="30" fill="#06b6d4" opacity="0.7"/>
<text x="550" y="49" text-anchor="middle" fill="#0a0e1a" font-size="11" font-weight="700">PP comm</text>
<rect x="600" y="30" width="100" height="30" fill="#3d4a73" opacity="0.7"/>
<text x="650" y="49" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">barrier</text>
</g>
<g transform="translate(60,180)">
<text x="0" y="0" fill="#a78bfa" font-size="12" font-weight="700">方向 A (forward stream)</text>
<rect x="0" y="20" width="40" height="20" fill="#f59e0b"/>
