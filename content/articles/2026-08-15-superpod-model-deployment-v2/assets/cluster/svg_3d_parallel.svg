<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="460" fill="#0a0e1a"/>
<text x="460" y="32" text-anchor="middle" fill="#e8ecf5" font-size="20" font-weight="700">S19 · 3D + EP 并行拓扑 — TP × PP × DP + EP 实战</text>
<text x="460" y="54" text-anchor="middle" fill="#aab2cf" font-size="12">DeepSeek V3 = 8 PP × (TP=1) × 256 DP (节点间) × 256 EP (专家) + ZeRO-1</text>
<g transform="translate(60,90)">
<text x="0" y="0" fill="#7eb6ff" font-size="13" font-weight="700">单节点内 8 GPU (NVLink 域)</text>
<g transform="translate(0,15)">
<rect x="0" y="0" width="60" height="60" fill="#1c2440" stroke="#7eb6ff" stroke-width="2"/>
<text x="30" y="25" text-anchor="middle" fill="#7eb6ff" font-size="11">GPU 0</text>
<text x="30" y="40" text-anchor="middle" fill="#aab2cf" font-size="9">H800</text>
<rect x="70" y="0" width="60" height="60" fill="#1c2440" stroke="#7eb6ff" stroke-width="2"/>
<text x="100" y="25" text-anchor="middle" fill="#7eb6ff" font-size="11">GPU 1</text>
<rect x="140" y="0" width="60" height="60" fill="#1c2440" stroke="#7eb6ff" stroke-width="2"/>
<text x="170" y="25" text-anchor="middle" fill="#7eb6ff" font-size="11">GPU 2</text>
<rect x="210" y="0" width="60" height="60" fill="#1c2440" stroke="#7eb6ff" stroke-width="2"/>
<text x="240" y="25" text-anchor="middle" fill="#7eb6ff" font-size="11">GPU 3</text>
<rect x="0" y="70" width="60" height="60" fill="#1c2440" stroke="#7eb6ff" stroke-width="2"/>
<text x="30" y="95" text-anchor="middle" fill="#7eb6ff" font-size="11">GPU 4</text>
<rect x="70" y="70" width="60" height="60" fill="#1c2440" stroke="#7eb6ff" stroke-width="2"/>
<text x="100" y="95" text-anchor="middle" fill="#7eb6ff" font-size="11">GPU 5</text>
<rect x="140" y="70" width="60" height="60" fill="#1c2440" stroke="#7eb6ff" stroke-width="2"/>
<text x="170" y="95" text-anchor="middle" fill="#7eb6ff" font-size="11">GPU 6</text>
<rect x="210" y="70" width="60" height="60" fill="#1c2440" stroke="#7eb6ff" stroke-width="2"/>
<text x="240" y="95" text-anchor="middle" fill="#7eb6ff" font-size="11">GPU 7</text>
</g>
<text x="0" y="160" fill="#aab2cf" font-size="10">→ NVLink 900 GB/s 全互联, TP=8 (8-way tensor parallel)</text>
<text x="0" y="178" fill="#aab2cf" font-size="10">→ V3 不用 TP (TF32 dense 直接 dense), 仅 MoE 走 EP</text>
</g>
<g transform="translate(360,90)">
<text x="0" y="0" fill="#a78bfa" font-size="13" font-weight="700">跨节点 IB (InfiniBand) — 8 plane</text>
<g transform="translate(0,15)">
<rect x="0" y="0" width="40" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="20" y="25" text-anchor="middle" fill="#a78bfa" font-size="9">Node 0</text>
<rect x="50" y="0" width="40" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="70" y="25" text-anchor="middle" fill="#a78bfa" font-size="9">Node 1</text>
<rect x="100" y="0" width="40" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="120" y="25" text-anchor="middle" fill="#a78bfa" font-size="9">Node 2</text>
<rect x="150" y="0" width="40" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="170" y="25" text-anchor="middle" fill="#a78bfa" font-size="9">Node 3</text>
<rect x="200" y="0" width="40" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="220" y="25" text-anchor="middle" fill="#a78bfa" font-size="9">Node 4</text>
<rect x="250" y="0" width="40" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="270" y="25" text-anchor="middle" fill="#a78bfa" font-size="9">Node 5</text>
<rect x="300" y="0" width="40" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="320" y="25" text-anchor="middle" fill="#a78bfa" font-size="9">Node 6</text>
<rect x="350" y="0" width="40" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="370" y="25" text-anchor="middle" fill="#a78bfa" font-size="9">Node 7</text>
<text x="0" y="55" fill="#aab2cf" font-size="9">↓ Multi-Plane Fat-Tree (MPFT)</text>
<text x="0" y="75" fill="#aab2cf" font-size="9">8 GPU ↔ 8 NIC, 1:1 配对 8 plane</text>
<text x="0" y="90" fill="#aab2cf" font-size="9">2 层 fat-tree, 理论 16,384 GPU</text>
<text x="0" y="105" fill="#aab2cf" font-size="9">实际部署 2,048 GPU</text>
</g>
</g>
<g transform="translate(60,300)">
<text x="0" y="0" fill="#10b981" font-size="13" font-weight="700">DeepSeek V3 = 4D 并行 + DualPipe</text>
<text x="0" y="20" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">PP=8</tspan>: 跨节点流水线 (前 3 层 dense + 58 层 MoE)</text>
<text x="0" y="38" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">EP=64</tspan>: 256 routed experts / 64 nodes, 每 node 4 expert, 1 shared</text>
<text x="0" y="56" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">DP=32</tspan>: micro-batch 并行 (ZeRO-1 + 数据并行)</text>
<text x="0" y="74" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">TP=1</tspan>: TF32 dense 部分不用 TP, NVLink 域内 only</text>
<text x="0" y="92" fill="#e8ecf5" font-size="11">• <tspan fill="#f59e0b" font-weight="700">DualPipe</tspan>: 双向 PP, A2A + PP 通信完全隐藏在计算里</text>
<text x="0" y="110" fill="#e8ecf5" font-size="11">• <tspan fill="#f59e0b" font-weight="700">FP8 全栈</tspan>: 1×128 act + 128×128 weight block scaling, E4M3 全量化</text>
<text x="0" y="128" fill="#e8ecf5" font-size="11">• 训练 <tspan fill="#10b981" font-weight="700">2.788M H800 GPU-hours @ $2/hr = $5.576M</tspan> 训完 14.8T tokens</text>
</g>
<text x="460" y="450" text-anchor="middle" fill="#aab2cf" font-size="10" font-style="italic">来源: DeepSeek-V3 paper §3 + Insights into DeepSeek-V3 paper arXiv:2505.09343 (ISCA 2025)</text>
</svg>
