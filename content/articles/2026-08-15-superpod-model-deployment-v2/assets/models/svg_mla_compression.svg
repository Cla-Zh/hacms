<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="460" fill="#0a0e1a"/>
<text x="460" y="32" text-anchor="middle" fill="#e8ecf5" font-size="20" font-weight="700">S17 · MLA (Multi-head Latent Attention) KV 压缩比</text>
<text x="460" y="54" text-anchor="middle" fill="#aab2cf" font-size="12">DeepSeek V2/V3 发明 — 把 KV 压缩到 1 个 512 维 latent, 压缩 93.3%</text>
<g transform="translate(60,90)">
<text x="0" y="0" fill="#7eb6ff" font-size="13" font-weight="700">传统 MHA (Multi-Head Attention) KV cache</text>
<rect x="0" y="15" width="800" height="60" fill="#1c2440" stroke="#7eb6ff" rx="4"/>
<g transform="translate(20,25)">
<rect x="0" y="0" width="100" height="40" fill="#7eb6ff" opacity="0.4"/>
<text x="50" y="20" text-anchor="middle" fill="#e8ecf5" font-size="10">Head 1</text>
<text x="50" y="34" text-anchor="middle" fill="#aab2cf" font-size="8">128 dim</text>
<rect x="104" y="0" width="100" height="40" fill="#7eb6ff" opacity="0.4"/>
<text x="154" y="20" text-anchor="middle" fill="#e8ecf5" font-size="10">Head 2</text>
<text x="154" y="34" text-anchor="middle" fill="#aab2cf" font-size="8">128 dim</text>
<rect x="208" y="0" width="100" height="40" fill="#7eb6ff" opacity="0.4"/>
<text x="258" y="20" text-anchor="middle" fill="#e8ecf5" font-size="10">Head 3</text>
<text x="258" y="34" text-anchor="middle" fill="#aab2cf" font-size="8">128 dim</text>
<text x="320" y="20" text-anchor="middle" fill="#aab2cf" font-size="9">...</text>
<rect x="360" y="0" width="100" height="40" fill="#7eb6ff" opacity="0.4"/>
<text x="410" y="20" text-anchor="middle" fill="#e8ecf5" font-size="10">Head 32</text>
<text x="410" y="34" text-anchor="middle" fill="#aab2cf" font-size="8">128 dim</text>
<rect x="464" y="0" width="100" height="40" fill="#7eb6ff" opacity="0.4"/>
<text x="514" y="20" text-anchor="middle" fill="#e8ecf5" font-size="10">K (sep)</text>
<text x="514" y="34" text-anchor="middle" fill="#aab2cf" font-size="8">4096 dim</text>
<rect x="568" y="0" width="100" height="40" fill="#7eb6ff" opacity="0.4"/>
<text x="618" y="20" text-anchor="middle" fill="#e8ecf5" font-size="10">V (sep)</text>
<text x="618" y="34" text-anchor="middle" fill="#aab2cf" font-size="8">4096 dim</text>
</g>
<text x="0" y="100" fill="#aab2cf" font-size="11">→ 总 KV cache: <tspan fill="#ef4444" font-weight="700">~4,096 × seq_len</tspan> (per layer, 32 heads × 128 dim × 2 K/V)</text>
</g>
<g transform="translate(60,210)">
<text x="0" y="0" fill="#a78bfa" font-size="13" font-weight="700">MLA 压缩路径</text>
<g transform="translate(0,20)">
<rect x="0" y="0" width="380" height="40" fill="#1c2440" stroke="#a78bfa"/>
<text x="190" y="25" text-anchor="middle" fill="#e8ecf5" font-size="11">Input x: 4096 dim</text>
</g>
<g transform="translate(0,75)">
<line x1="190" y1="40" x2="190" y2="65" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
<polygon points="0 0, 10 5, 0 10" fill="#a78bfa"/>
</marker>
</defs>
</g>
<g transform="translate(0,80)">
<rect x="0" y="0" width="180" height="40" fill="#a78bfa"/>
<text x="90" y="20" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">W^DKV · x</text>
<text x="90" y="34" text-anchor="middle" fill="#aab2cf" font-size="9">down-projection</text>
<rect x="200" y="0" width="80" height="40" fill="#7eb6ff"/>
<text x="240" y="14" text-anchor="middle" fill="#0a0e1a" font-size="9" font-weight="700">c_t^KV</text>
<text x="240" y="30" text-anchor="middle" fill="#aab2cf" font-size="8">512 dim latent</text>
<rect x="300" y="0" width="100" height="40" fill="#7eb6ff" opacity="0.3"/>
<text x="350" y="20" text-anchor="middle" fill="#e8ecf5" font-size="10">缓存这 512 维</text>
<text x="350" y="34" text-anchor="middle" fill="#aab2cf" font-size="8">per token</text>
</g>
<g transform="translate(0,140)">
<line x1="240" y1="40" x2="240" y2="60" stroke="#a78bfa" stroke-width="2" marker-end="url(#arr)"/>
<rect x="180" y="65" width="120" height="35" fill="#a78bfa" opacity="0.6"/>
<text x="240" y="80" text-anchor="middle" fill="#fff" font-size="9">W^UK · c^KV</text>
<text x="240" y="93" text-anchor="middle" fill="#aab2cf" font-size="8">↑ K 解压</text>
<rect x="310" y="65" width="100" height="35" fill="#a78bfa" opacity="0.6"/>
<text x="360" y="80" text-anchor="middle" fill="#fff" font-size="9">W^UV · c^KV</text>
<text x="360" y="93" text-anchor="middle" fill="#aab2cf" font-size="8">↑ V 解压</text>
</g>
</g>
<g transform="translate(60,400)">
<text x="0" y="0" fill="#10b981" font-size="13" font-weight="700">压缩效果</text>
<text x="0" y="22" fill="#e8ecf5" font-size="11">• MHA → 4,096 dim per token → MLA → <tspan fill="#10b981" font-weight="700">512 dim latent</tspan> ≈ <tspan fill="#10b981" font-weight="700">8× 压缩</tspan> (vs 单 head 128 dim) 或 <tspan fill="#10b981" font-weight="700">93.3% 压缩</tspan> (vs full KV)</text>
<text x="0" y="40" fill="#e8ecf5" font-size="11">• 解耦 Q/K: Q 压缩到 1,536 dim latent (d'_c), per-head 64 dim — 灵活</text>
<text x="0" y="58" fill="#e8ecf5" font-size="11">• V3 KV cache ≈ MHA 的 5-13% (DeepSeek 自家 benchmark)</text>
</g>
<text x="460" y="450" text-anchor="middle" fill="#aab2cf" font-size="10" font-style="italic">来源: DeepSeek-V2 paper arXiv:2405.04434 + V3 paper §2.1 + Kimi K2 用类似 MLA 思路</text>
</svg>
