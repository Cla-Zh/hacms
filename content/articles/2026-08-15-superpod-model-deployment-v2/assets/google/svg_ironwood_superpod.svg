<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="920" height="460" fill="#0a0e1a"/>
<text x="460" y="32" text-anchor="middle" fill="#e8ecf5" font-size="20" font-weight="700">S13 · Google TPU Ironwood 9,216 chip Superpod + OCS</text>
<text x="460" y="54" text-anchor="middle" fill="#aab2cf" font-size="12">3D torus 4×4×4 cube × 144 cube + Optical Circuit Switch 可重构</text>
<g transform="translate(60,90)">
<text x="0" y="0" fill="#7eb6ff" font-size="13" font-weight="700">单 chip (TPU v7 Ironwood)</text>
<rect x="0" y="10" width="180" height="80" fill="#1c2440" stroke="#7eb6ff" rx="6"/>
<text x="10" y="32" fill="#e8ecf5" font-size="10">192 GiB HBM3e (8 栈)</text>
<text x="10" y="48" fill="#e8ecf5" font-size="10">7.38 TB/s 内存带宽</text>
<text x="10" y="64" fill="#e8ecf5" font-size="10">4,614 TFLOPS FP8</text>
<text x="10" y="80" fill="#e8ecf5" font-size="10">1.2 TB/s ICI (双向)</text>
</g>
<g transform="translate(280,90)">
<text x="0" y="0" fill="#a78bfa" font-size="13" font-weight="700">Cube (4×4×4 = 64 chip)</text>
<g transform="translate(0,15)">
<g transform="translate(0,0)">
<rect x="0" y="0" width="14" height="14" fill="#a78bfa"/>
<rect x="14" y="0" width="14" height="14" fill="#a78bfa"/>
<rect x="28" y="0" width="14" height="14" fill="#a78bfa"/>
<rect x="42" y="0" width="14" height="14" fill="#a78bfa"/>
<rect x="0" y="14" width="14" height="14" fill="#a78bfa"/>
<rect x="14" y="14" width="14" height="14" fill="#a78bfa"/>
<rect x="28" y="14" width="14" height="14" fill="#a78bfa"/>
<rect x="42" y="14" width="14" height="14" fill="#a78bfa"/>
<rect x="0" y="28" width="14" height="14" fill="#a78bfa"/>
<rect x="14" y="28" width="14" height="14" fill="#a78bfa"/>
<rect x="28" y="28" width="14" height="14" fill="#a78bfa"/>
<rect x="42" y="28" width="14" height="14" fill="#a78bfa"/>
<rect x="0" y="42" width="14" height="14" fill="#a78bfa"/>
<rect x="14" y="42" width="14" height="14" fill="#a78bfa"/>
<rect x="28" y="42" width="14" height="14" fill="#a78bfa"/>
<rect x="42" y="42" width="14" height="14" fill="#a78bfa"/>
</g>
<text x="80" y="20" fill="#aab2cf" font-size="9">3D torus</text>
<text x="80" y="34" fill="#aab2cf" font-size="9">6 邻居</text>
<text x="80" y="48" fill="#aab2cf" font-size="9">per chip</text>
<text x="80" y="62" fill="#aab2cf" font-size="9">(3 轴向)</text>
</g>
</g>
<g transform="translate(440,90)">
<text x="0" y="0" fill="#f59e0b" font-size="13" font-weight="700">Pod (4 cube = 256 chip)</text>
<rect x="0" y="15" width="180" height="80" fill="#1c2440" stroke="#f59e0b" rx="6"/>
<text x="10" y="36" fill="#e8ecf5" font-size="10">通过 OCS 互联</text>
<text x="10" y="52" fill="#e8ecf5" font-size="10">光路可重构切片</text>
<text x="10" y="68" fill="#e8ecf5" font-size="10">租户级隔离</text>
<text x="10" y="84" fill="#e8ecf5" font-size="10">故障域重路由</text>
</g>
<g transform="translate(660,90)">
<text x="0" y="0" fill="#10b981" font-size="13" font-weight="700">Superpod (144 cube = 9,216 chip)</text>
<rect x="0" y="15" width="220" height="80" fill="#1c2440" stroke="#10b981" stroke-width="2" rx="6"/>
<text x="10" y="36" fill="#10b981" font-size="10" font-weight="700">42.5 EFLOPS FP8 peak</text>
<text x="10" y="52" fill="#e8ecf5" font-size="10">1.77 PB 直接访问 HBM</text>
<text x="10" y="68" fill="#e8ecf5" font-size="10">全 3D torus + OCS</text>
<text x="10" y="84" fill="#e8ecf5" font-size="10">支持 JAX / PyTorch</text>
</g>
<g transform="translate(60,250)">
<text x="0" y="0" fill="#7eb6ff" font-size="13" font-weight="700">OCS (Optical Circuit Switch) 关键作用</text>
<text x="0" y="22" fill="#e8ecf5" font-size="11">• 动态建立 cube 间光路, 不是逐包交换 (vs IB/Ethernet)</text>
<text x="0" y="40" fill="#e8ecf5" font-size="11">• Fabric manager 绕过故障 cube/链路, 接入备用单元</text>
<text x="0" y="58" fill="#e8ecf5" font-size="11">• 按作业重构不同大小和形状的 slice (1 cube / 4 cube / 144 cube)</text>
<text x="0" y="76" fill="#e8ecf5" font-size="11">• 同时承担 <tspan fill="#7eb6ff" font-weight="700">拓扑适配 + 租户切片 + 容错</tspan> 三大功能</text>
<text x="0" y="94" fill="#e8ecf5" font-size="11">• 多个 Superpod 通过标准数据中心网络互连, 可扩至数十万芯片</text>
</g>
<g transform="translate(60,360)">
<text x="0" y="0" fill="#f59e0b" font-size="13" font-weight="700">Ironwood 横向对标</text>
<text x="0" y="22" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">vs NVL72</tspan>: 单 pod 1.77 PB HBM vs 13.4 TB — 132× (但 TPU pod 9,216 chip)</text>
<text x="0" y="40" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">vs Atlas 950</tspan>: OCS 可重构 vs UB 固定 — TPU 在弹性更强</text>
<text x="0" y="58" fill="#e8ecf5" font-size="11">• <tspan fill="#7eb6ff" font-weight="700">首批客户</tspan>: Gemini 2.5/3 (Google 一方) + Anthropic Claude Opus 5 (外部)</text>
</g>
<text x="460" y="445" text-anchor="middle" fill="#aab2cf" font-size="10" font-style="italic">Source: blog.google ironwood + cloud.google.com Ironwood codesigned AI stack</text>
</svg>
