<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">验证强度层级与自改进强度的对应关系</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#555555">Verification Strength Hierarchy ↔ Demonstrated Self-Improvement Strength</text>
  <text x="400" y="68" text-anchor="middle" font-size="10" fill="#777777">依据 arXiv:2607.07663 对 1,250 篇文献的系统映射 · Based on a systematic map of 1,250 papers</text>

  <!-- Axis -->
  <line x1="120" y1="390" x2="700" y2="390" stroke="#333333" stroke-width="1.5"/>
  <polygon points="700,390 692,386 692,394" fill="#333333"/>
  <text x="700" y="408" text-anchor="end" font-size="11" fill="#333333" font-weight="bold">验证强度递增 →</text>
  <text x="700" y="422" text-anchor="end" font-size="9" fill="#777777">Increasing verification strength →</text>

  <!-- Level V-1 : Formal verifier -->
  <rect x="120" y="95" width="86" height="295" fill="#111111"/>
  <text x="163" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">形式化</text>
  <text x="163" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">验证器</text>
  <text x="163" y="152" text-anchor="middle" font-size="8" fill="#cccccc">Formal</text>
  <text x="163" y="163" text-anchor="middle" font-size="8" fill="#cccccc">Verifier</text>
  <text x="163" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">最硬</text>
  <text x="163" y="196" text-anchor="middle" font-size="8" fill="#cccccc">Strongest</text>

  <!-- Level V-2 -->
  <rect x="216" y="150" width="86" height="240" fill="#333333"/>
  <text x="259" y="173" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">外部接地</text>
  <text x="259" y="187" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">评估</text>
  <text x="259" y="207" text-anchor="middle" font-size="8" fill="#cccccc">Externally</text>
  <text x="259" y="218" text-anchor="middle" font-size="8" fill="#cccccc">Grounded Eval</text>

  <!-- Level V-3 -->
  <rect x="312" y="215" width="86" height="175" fill="#666666"/>
  <text x="355" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">学习型</text>
  <text x="355" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">评判器</text>
  <text x="355" y="272" text-anchor="middle" font-size="8" fill="#eeeeee">Learned</text>
  <text x="355" y="283" text-anchor="middle" font-size="8" fill="#eeeeee">Judge / PRM</text>

  <!-- Level V-4 -->
  <rect x="408" y="290" width="86" height="100" fill="#6e6e6e"/>
  <text x="451" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">内生</text>
  <text x="451" y="327" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">自评</text>
  <text x="451" y="347" text-anchor="middle" font-size="8" fill="#ffffff">Endogenous</text>
  <text x="451" y="358" text-anchor="middle" font-size="8" fill="#ffffff">Self-Eval</text>
  <text x="451" y="378" text-anchor="middle" font-size="9" font-weight="bold" fill="#ffffff">最弱</text>

  <!-- Warning for V-4 -->
  <rect x="510" y="295" width="180" height="95" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="600" y="315" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">接线风险 / Wireheading</text>
  <text x="600" y="333" text-anchor="middle" font-size="9" fill="#333333">奖励饱和 ≈1.0</text>
  <text x="600" y="346" text-anchor="middle" font-size="9" fill="#333333">准确率停在 ≈0.05</text>
  <text x="600" y="365" text-anchor="middle" font-size="8" fill="#777777">UK AISI arXiv:2511.23092</text>
  <text x="600" y="378" text-anchor="middle" font-size="8" fill="#777777">Llama-3.1-8B / Mistral-7B</text>

  <!-- Representative works -->
  <text x="163" y="405" text-anchor="middle" font-size="8" fill="#333333">AlphaTensor</text>
  <text x="163" y="416" text-anchor="middle" font-size="8" fill="#333333">AlphaEvolve</text>
  <text x="259" y="405" text-anchor="middle" font-size="8" fill="#333333">RE-Bench</text>
  <text x="355" y="405" text-anchor="middle" font-size="8" fill="#333333">AI Scientist</text>
  <text x="451" y="405" text-anchor="middle" font-size="8" fill="#333333">R-Zero</text>
  <text x="451" y="416" text-anchor="middle" font-size="8" fill="#333333">Intuitor</text>

  <!-- Bottom insight -->
  <rect x="60" y="432" width="680" height="20" fill="#f5f5f5"/>
  <text x="400" y="446" text-anchor="middle" font-size="10" fill="#111111" font-weight="bold">核心观察：验证强度与自改进强度呈相关排序 · Verification strength correlates with self-improvement strength</text>
</svg>