<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">递归自我改进的 L1–L5 自主度分级</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#555555">L1–L5 Autonomy Levels for Recursive Self-Improvement</text>
  <text x="400" y="68" text-anchor="middle" font-size="10" fill="#777777">依据 arXiv:2609.11873 · Based on arXiv:2609.11873</text>

  <!-- Vertical axis -->
  <line x1="105" y1="90" x2="105" y2="410" stroke="#333333" stroke-width="1.5"/>
  <polygon points="105,85 101,93 109,93" fill="#333333"/>
  <text x="99" y="80" text-anchor="end" font-size="9" fill="#333333" font-weight="bold">自主度递增</text>
  <text x="99" y="92" text-anchor="end" font-size="8" fill="#777777">↑</text>

  <!-- L1 -->
  <rect x="115" y="355" width="620" height="48" fill="#e8e8e8" stroke="#333333" stroke-width="1"/>
  <text x="130" y="375" font-size="12" font-weight="bold" fill="#111111">L1 改进执行自主</text>
  <text x="130" y="392" font-size="9" fill="#555555">执行人类定义的改进流程 · Executes a human-defined improvement process</text>
  <text x="720" y="375" text-anchor="end" font-size="9" fill="#111111">EvoStage</text>
  <text x="720" y="392" text-anchor="end" font-size="8" fill="#777777">AlphaTensor</text>

  <!-- L2 -->
  <rect x="115" y="300" width="620" height="48" fill="#d4d4d4" stroke="#333333" stroke-width="1"/>
  <text x="130" y="320" font-size="12" font-weight="bold" fill="#111111">L2 改进策略自主</text>
  <text x="130" y="337" font-size="9" fill="#333333">自主选择策略，目标与验收仍外部固定 · Chooses strategies; goals and acceptance remain externally fixed</text>
  <text x="720" y="320" text-anchor="end" font-size="9" fill="#111111">DGM · AlphaEvolve</text>
  <text x="720" y="337" text-anchor="end" font-size="8" fill="#555555">ShinkaEvolve · CodeEvolve</text>

  <!-- L3 -->
  <rect x="115" y="245" width="620" height="48" fill="#8c8c8c" stroke="#333333" stroke-width="1"/>
  <text x="130" y="265" font-size="12" font-weight="bold" fill="#111111">L3 经验获取自主</text>
  <text x="130" y="282" font-size="9" fill="#ffffff">自主决定到哪里、如何获取经验 · Decides where and how to acquire experience</text>
  <text x="720" y="265" text-anchor="end" font-size="9" fill="#ffffff">R-Zero</text>
  <text x="720" y="282" text-anchor="end" font-size="8" fill="#eeeeee">RSI-Anything</text>

  <!-- L4 -->
  <rect x="115" y="190" width="620" height="48" fill="#6e6e6e" stroke="#333333" stroke-width="1"/>
  <text x="130" y="210" font-size="12" font-weight="bold" fill="#ffffff">L4 环境适应自主</text>
  <text x="130" y="227" font-size="9" fill="#ffffff">重塑运行环境以支撑持续改进 · Reshapes the environment to sustain improvement</text>
  <text x="720" y="210" text-anchor="end" font-size="9" fill="#ffffff">WorldEvolver</text>
  <text x="720" y="227" text-anchor="end" font-size="8" fill="#eeeeee">Dream-RSI</text>

  <!-- L5 -->
  <rect x="115" y="120" width="620" height="62" fill="#111111" stroke="#111111" stroke-width="1"/>
  <text x="130" y="142" font-size="12" font-weight="bold" fill="#ffffff">L5 递归元改进</text>
  <text x="130" y="160" font-size="9" fill="#dddddd">改变支配后续改进的机制本身 · Changes the mechanism that governs future improvement</text>
  <text x="130" y="174" font-size="8" fill="#aaaaaa">← 2026 年前沿 · The 2026 frontier</text>
  <text x="720" y="142" text-anchor="end" font-size="9" fill="#ffffff">HyperAgents</text>
  <text x="720" y="158" text-anchor="end" font-size="8" fill="#cccccc">Red Queen Gödel Machine</text>
  <text x="720" y="172" text-anchor="end" font-size="8" fill="#cccccc">EvoX · AdaEvolve</text>

  <!-- Annotation arrow: saturated vs frontier -->
  <rect x="115" y="288" width="620" height="10" fill="#ffffff"/>
  <line x1="115" y1="293" x2="735" y2="293" stroke="#111111" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="425" y="300" text-anchor="middle" font-size="8" fill="#111111">L1–L2 已饱和（SWE-bench &gt;90%，DGM 20%→50%，SICA 17%→53%）· L1–L2 saturated</text>

  <!-- Key distinction box -->
  <rect x="115" y="410" width="620" height="40" fill="#f7f7f7" stroke="#111111" stroke-width="1"/>
  <text x="425" y="426" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">判据：「自动化优化 ≠ 自我改进」</text>
  <text x="425" y="440" text-anchor="middle" font-size="8" fill="#555555">对外部产物的 AI 生成改进 ≠ 生成它的系统被改进 · Improving an artifact ≠ improving the system that produced it</text>
</svg>