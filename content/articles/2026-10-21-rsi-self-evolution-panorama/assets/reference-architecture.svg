<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1a1a1a">图 1 · RSI 七层参考架构</text>
  <text x="24" y="46" font-size="11" fill="#5a5a5a" font-style="italic">Seven-Layer Reference Architecture of Recursive Self-Improvement</text>
  <g>
  <rect x="24" y="62" width="210" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="34" y="78" font-size="11.5" font-weight="700" fill="#1a1a1a">L1 · 任务域</text>
    <text x="34" y="93" font-size="9.5" fill="#5a5a5a">Task Domain</text>
  <rect x="240" y="62" width="536" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="250" y="78" font-size="10" fill="#1a1a1a">机器可评分问题 · SWE-bench / Polyglot · DeepSWE / 论文写作 / 证明评分</text>
    <text x="250" y="93" font-size="9" fill="#5a5a5a">AlphaEvolve 2.1 · DGM 1 · RQGM 4</text>
  </g>
  <g>
  <rect x="24" y="106" width="210" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="34" y="122" font-size="11.5" font-weight="700" fill="#1a1a1a">L2 · 搜索空间</text>
    <text x="34" y="137" font-size="9.5" fill="#5a5a5a">Search Space</text>
  <rect x="240" y="106" width="536" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="250" y="122" font-size="10" fill="#1a1a1a"># EVOLVE-BLOCK 标注的代码块 · 被采样代理的源码 · 任务代理 + 元代理 + 评估器</text>
    <text x="250" y="137" font-size="9" fill="#5a5a5a">AlphaEvolve 2.1 · DGM 1 · RQGM B.1</text>
  </g>
  <g>
  <rect x="24" y="150" width="210" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="34" y="166" font-size="11.5" font-weight="700" fill="#1a1a1a">L3 · 变更算子</text>
    <text x="34" y="181" font-size="9.5" fill="#5a5a5a">Mutation Operator</text>
  <rect x="240" y="150" width="536" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="250" y="166" font-size="10" fill="#1a1a1a">SEARCH/REPLACE diff 块 · 基础模型产生源码 diff · 元代理编辑工作区</text>
    <text x="250" y="181" font-size="9" fill="#5a5a5a">AlphaEvolve 2.3 · DGM 1 · RQGM B.1</text>
  </g>
  <g>
  <rect x="24" y="194" width="210" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="34" y="210" font-size="11.5" font-weight="700" fill="#1a1a1a">L4 · 档案与选择</text>
    <text x="34" y="225" font-size="9.5" fill="#5a5a5a">Archive &amp; Selection</text>
  <rect x="240" y="194" width="536" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="250" y="210" font-size="10" fill="#1a1a1a">MAP-Elites + 岛屿模型 · 开放探索档案累积全部变体 · UCB-Air 门控 + 选择性擦除</text>
    <text x="250" y="225" font-size="9" fill="#5a5a5a">AlphaEvolve 2.5 · DGM 1 · RQGM B.2-B.3</text>
  </g>
  <g>
  <rect x="24" y="238" width="210" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="34" y="254" font-size="11.5" font-weight="700" fill="#1a1a1a">L5 · 效用信号</text>
    <text x="34" y="269" font-size="9.5" fill="#5a5a5a">Utility Signal</text>
  <rect x="240" y="238" width="536" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="250" y="254" font-size="10" fill="#1a1a1a">evaluate 标量字典 · 编码基准 · epoch 内冻结的评估器</text>
    <text x="250" y="269" font-size="9" fill="#5a5a5a">AlphaEvolve 2.1/2.4 · DGM 1 · RQGM 3.2</text>
  </g>
  <g>
  <rect x="24" y="282" width="210" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="34" y="298" font-size="11.5" font-weight="700" fill="#1a1a1a">L6 · 执行隔离</text>
    <text x="34" y="313" font-size="9.5" fill="#5a5a5a">Execution Isolation</text>
  <rect x="240" y="282" width="536" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="250" y="298" font-size="10" fill="#1a1a1a">隔离沙箱 + 严格时间限制 · asyncio 异步流水线 · 留出数据隔离</text>
    <text x="250" y="313" font-size="9" fill="#5a5a5a">DGM 安全节 · AlphaEvolve 2.6 · RQGM B.1</text>
  </g>
  <g>
  <rect x="24" y="326" width="210" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="34" y="342" font-size="11.5" font-weight="700" fill="#1a1a1a">L7 · 可追溯与监督</text>
    <text x="34" y="357" font-size="9.5" fill="#5a5a5a">Traceability &amp; Oversight</text>
  <rect x="240" y="326" width="536" height="38" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.1"/>
    <text x="250" y="342" font-size="10" fill="#1a1a1a">修改谱系可追溯供审查 · 主动监控性能与代码变更 · 留出评测协议</text>
    <text x="250" y="357" font-size="9" fill="#5a5a5a">DGM 安全节 · RQGM 4</text>
  </g>
  <g>
  <rect x="24" y="370" width="210" height="40" fill="#ffffff" stroke="#8b3a3a" stroke-width="1.4"/>
    <text x="34" y="387" font-size="11.5" font-weight="700" fill="#8b3a3a">M · 评估器共演化</text>
    <text x="34" y="402" font-size="9.5" fill="#5a5a5a">Evaluator Co-Evolution (可选)</text>
  <rect x="240" y="370" width="536" height="40" fill="#fdf8f8" stroke="#8b3a3a" stroke-width="1.1" stroke-dasharray="4 3"/>
    <text x="250" y="387" font-size="10" fill="#1a1a1a">受控效用演化：冻结 → 共演化挑战者 → 替换规则 → 选择性擦除</text>
    <text x="250" y="402" font-size="9" fill="#5a5a5a">仅 RQGM 实现 · AlphaEvolve 与 DGM 在此层为空白</text>
  </g>
  <path d="M 24 232 L 8 232 L 8 125 L 24 125" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
  <path d="M 24 125 L 16 119 L 16 131 Z" fill="#1a1a1a"/>
  <text x="8" y="312" font-size="9" fill="#1a1a1a" text-anchor="middle" transform="rotate(-90 8 312)">L4 提供父代 → L2</text>
  <path d="M 240 390 L 232 410" fill="none" stroke="#8b3a3a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text x="24" y="432" font-size="9.5" fill="#8b3a3a">红色虚线 = 缺口：三个系统都假设验证器可信，无一将「验证器本身可能被改进掉」纳入架构。</text>
  <text x="24" y="445" font-size="9.5" fill="#8b3a3a">DGM 提出但未实现「创建不可修改的部分以评估并在必要时停止其余部分」。</text>
  <text x="24" y="457" font-size="8.5" fill="#5a5a5a">Red dashed = the gap. DGM proposes but does not implement an unmodifiable part of the system to evaluate and halt the rest.</text>
</svg>