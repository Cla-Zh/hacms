<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
<rect width="800" height="460" fill="#ffffff"/>

<text x="400" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">改进闭环控制流 · The Improvement Loop Control Flow</text>
<text x="400" y="44" text-anchor="middle" font-size="10.5" fill="#5a5a5a">「递归」的分水岭：反馈是否回到系统自身 / whether feedback re-enters the system itself</text>

<!-- Cycle nodes -->
<g>
<!-- 1 现状 -->
<rect x="52" y="150" width="150" height="76" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="127" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">① 现状系统</text>
<text x="127" y="194" text-anchor="middle" font-size="10.5" fill="#3a3a3a">代码库 / 权重</text>
<text x="127" y="210" text-anchor="middle" font-size="10.5" fill="#3a3a3a">prompt·tool·workflow</text>
</g>

<!-- 2 提议改进 -->
<rect x="255" y="72" width="160" height="66" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="335" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">② 提议改进</text>
<text x="335" y="113" text-anchor="middle" font-size="10.5" fill="#3a3a3a">改写哪一层？</text>
<text x="335" y="128" text-anchor="middle" font-size="10.5" fill="#3a3a3a">L4 搜索产生候选</text>

<!-- 3 隔离执行 -->
<rect x="470" y="150" width="160" height="76" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="550" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">③ 隔离执行</text>
<text x="550" y="194" text-anchor="middle" font-size="10.5" fill="#3a3a3a">沙箱内重放基准</text>
<text x="550" y="210" text-anchor="middle" font-size="10.5" fill="#3a3a3a">不得污染宿主</text>

<!-- 4 评分 -->
<rect x="255" y="238" width="160" height="66" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="335" y="261" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">④ 评分</text>
<text x="335" y="279" text-anchor="middle" font-size="10.5" fill="#3a3a3a">L2 评估器判定</text>
<text x="335" y="294" text-anchor="middle" font-size="10.5" fill="#3a3a3a">「更好」的量化</text>

<!-- 决策 -->
<polygon points="127,250 127,320 200,285" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="163" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">通过?</text>
<text x="163" y="297" text-anchor="middle" font-size="9.5" fill="#5a5a5a">pass?</text>

<!-- 5 归档 -->
<rect x="470" y="238" width="160" height="66" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="550" y="261" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">⑤ 归档为亲本</text>
<text x="550" y="279" text-anchor="middle" font-size="10.5" fill="#3a3a3a">进入种群档案</text>
<text x="550" y="294" text-anchor="middle" font-size="10.5" fill="#3a3a3a">DGM archive</text>

<!-- Arrows: 1->2 -->
<path d="M 202 176 L 253 116" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
<polygon points="253,116 245,115 249,124" fill="#1a1a1a"/>

<!-- 2->3 -->
<path d="M 415 110 L 468 172" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
<polygon points="468,172 457,170 463,161" fill="#1a1a1a"/>

<!-- 3->4 -->
<path d="M 500 200 L 400 258" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
<polygon points="400,258 409,250 410,259" fill="#1a1a1a"/>

<!-- 4->decision -->
<path d="M 253 268 L 200 282" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
<polygon points="200,282 210,274 210,287" fill="#1a1a1a"/>

<!-- decision yes -> 5 -->
<path d="M 175 266 L 300 246 L 468 258" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
<polygon points="468,258 458,251 458,263" fill="#1a1a1a"/>
<text x="320" y="240" font-size="10.5" fill="#2f6f4f" font-weight="700">是 yes</text>

<!-- 5 -> 1 (recursive re-entry) -->
<path d="M 630 238 L 630 60 L 127 60 L 127 148" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="127,148 122,137 132,137" fill="#1a1a1a"/>
<text x="400" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">新版本成为下一轮的起点 —— 这才是「递归」/ this re-entry is what makes it recursive</text>

<!-- decision no -> discard -->
<rect x="60" y="348" width="140" height="52" fill="#fafafa" stroke="#8b3a3a" stroke-width="1.2"/>
<text x="130" y="368" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8b3a3a">否 no → 丢弃</text>
<text x="130" y="386" text-anchor="middle" font-size="10" fill="#3a3a3a">不进入种群</text>
<path d="M 118 300 L 122 346" fill="none" stroke="#8b3a3a" stroke-width="1.2"/>
<polygon points="122,346 116,336 128,335" fill="#8b3a3a"/>

<!-- Feedback loop closure comparison -->
<rect x="232" y="330" width="546" height="98" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
<text x="244" y="349" font-size="11.5" font-weight="700" fill="#1a1a1a">闭环程度三个等级 · Three degrees of loop closure</text>

<rect x="244" y="358" width="164" height="58" fill="#ffffff" stroke="#e0e0e0"/>
<text x="252" y="374" font-size="10.5" font-weight="700" fill="#1a1a1a">human-in-the-loop</text>
<text x="252" y="390" font-size="9.5" fill="#3a3a3a">人批准每一次采纳</text>
<text x="252" y="406" font-size="9.5" fill="#5a5a5a">训练/工具调参的常态</text>

<rect x="416" y="358" width="164" height="58" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="424" y="374" font-size="10.5" font-weight="700" fill="#1a1a1a">human-on-the-loop ★</text>
<text x="424" y="390" font-size="9.5" fill="#3a3a3a">系统自动跑，人审计</text>
<text x="424" y="406" font-size="9.5" fill="#5a5a5a">文献中的主导模式</text>

<rect x="588" y="358" width="178" height="58" fill="#fafafa" stroke="#8b3a3a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="596" y="374" font-size="10.5" font-weight="700" fill="#8b3a3a">fully closed loop</text>
<text x="596" y="390" font-size="9.5" fill="#3a3a3a">无需人参与即自循环</text>
<text x="596" y="406" font-size="9.5" fill="#8b3a3a">稀疏；自改评估器几乎空白</text>
</svg>