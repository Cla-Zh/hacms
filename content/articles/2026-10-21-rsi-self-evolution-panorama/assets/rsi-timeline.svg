<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#111111">从理论构想到实验室披露：1987–2026 时间线</text>
  <text x="400" y="50" text-anchor="middle" font-size="12" fill="#555555">From Theoretical Concept to Lab Disclosure: A 1987–2026 Timeline</text>

  <!-- Main axis -->
  <line x1="55" y1="240" x2="750" y2="240" stroke="#111111" stroke-width="2"/>
  <polygon points="755,240 747,236 747,244" fill="#111111"/>

  <!-- Decade markers -->
  <line x1="55" y1="232" x2="55" y2="248" stroke="#111111" stroke-width="1"/>
  <text x="55" y="266" text-anchor="middle" font-size="9" fill="#555555" font-weight="bold">1987</text>
  <line x1="160" y1="234" x2="160" y2="246" stroke="#999999" stroke-width="1"/>
  <text x="160" y="266" text-anchor="middle" font-size="9" fill="#777777">1993</text>
  <line x1="255" y1="234" x2="255" y2="246" stroke="#999999" stroke-width="1"/>
  <text x="255" y="266" text-anchor="middle" font-size="9" fill="#777777">2022</text>
  <line x1="355" y1="234" x2="355" y2="246" stroke="#999999" stroke-width="1"/>
  <text x="355" y="266" text-anchor="middle" font-size="9" fill="#777777">2024</text>
  <line x1="455" y1="234" x2="455" y2="246" stroke="#999999" stroke-width="1"/>
  <text x="455" y="266" text-anchor="middle" font-size="9" fill="#777777">2025</text>
  <line x1="600" y1="232" x2="600" y2="248" stroke="#111111" stroke-width="1"/>
  <text x="600" y="266" text-anchor="middle" font-size="9" fill="#555555" font-weight="bold">2026</text>

  <!-- Upper row: foundational theory -->
  <line x1="55" y1="240" x2="55" y2="185" stroke="#999999" stroke-width="1"/>
  <circle cx="55" cy="240" r="4" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="55" y="172" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">Gödel Machine</text>
  <text x="55" y="161" text-anchor="middle" font-size="8" fill="#555555">Schmidhuber</text>
  <text x="55" y="151" text-anchor="middle" font-size="8" fill="#777777">显式自指元学习</text>

  <line x1="160" y1="240" x2="160" y2="190" stroke="#999999" stroke-width="1"/>
  <circle cx="160" cy="240" r="4" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="163" y="200" text-anchor="middle" font-size="8" fill="#555555">自我修改的</text>
  <text x="163" y="190" text-anchor="middle" font-size="8" fill="#555555">形式化尝试</text>

  <!-- AlphaTensor 2022 -->
  <line x1="255" y1="240" x2="255" y2="180" stroke="#999999" stroke-width="1"/>
  <circle cx="255" cy="240" r="5" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="255" y="166" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">AlphaTensor</text>
  <text x="255" y="155" text-anchor="middle" font-size="8" fill="#555555">权重级 RL</text>
  <text x="255" y="145" text-anchor="middle" font-size="8" fill="#555555">超越 Strassen 50 年</text>
  <text x="255" y="135" text-anchor="middle" font-size="8" fill="#777777">Nature 610:47-53</text>

  <!-- FunSearch 2024 -->
  <line x1="355" y1="240" x2="355" y2="180" stroke="#999999" stroke-width="1"/>
  <circle cx="355" cy="240" r="5" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="355" y="166" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">FunSearch</text>
  <text x="355" y="155" text-anchor="middle" font-size="8" fill="#555555">程序搜索做数学发现</text>
  <text x="355" y="145" text-anchor="middle" font-size="8" fill="#777777">Nature 625:468-475</text>

  <!-- AlphaEvolve 2025 -->
  <line x1="455" y1="240" x2="455" y2="90" stroke="#111111" stroke-width="1.5"/>
  <circle cx="455" cy="240" r="7" fill="#111111"/>
  <text x="455" y="76" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">AlphaEvolve</text>
  <text x="455" y="64" text-anchor="middle" font-size="8" fill="#555555">Borg 生产 0.7% 算力</text>
  <text x="455" y="54" text-anchor="middle" font-size="8" fill="#555555">矩阵乘 48 次（56 年来首次）</text>
  <text x="455" y="44" text-anchor="middle" font-size="8" fill="#777777">2025-05 博客 · 2025-06 白皮书 · 2026 PNAS</text>

  <!-- 2026 cluster -->
  <line x1="600" y1="240" x2="600" y2="180" stroke="#111111" stroke-width="1.5"/>
  <circle cx="600" cy="240" r="7" fill="#111111"/>
  <text x="600" y="166" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">2026 爆发</text>
  <text x="600" y="155" text-anchor="middle" font-size="8" fill="#555555">DGM → HyperAgents</text>
  <text x="600" y="145" text-anchor="middle" font-size="8" fill="#555555">RQGM · EvoX · AdaEvolve</text>
  <text x="600" y="135" text-anchor="middle" font-size="8" fill="#777777">Anthropic &gt;80% · OpenAI 3.1x</text>

  <!-- Lower row: key lab disclosures -->
  <line x1="410" y1="240" x2="410" y2="290" stroke="#999999" stroke-width="1"/>
  <circle cx="410" cy="240" r="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="410" y="304" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">DGM</text>
  <text x="410" y="315" text-anchor="middle" font-size="8" fill="#555555">SWE-bench 20→50%</text>
  <text x="410" y="325" text-anchor="middle" font-size="8" fill="#777777">2025-05 · ICLR 2026</text>

  <line x1="500" y1="240" x2="500" y2="330" stroke="#999999" stroke-width="1"/>
  <circle cx="500" cy="240" r="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="500" y="344" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">Anthropic AAR</text>
  <text x="500" y="355" text-anchor="middle" font-size="8" fill="#555555">PGR 0.97 vs 人类 0.23</text>
  <text x="500" y="365" text-anchor="middle" font-size="8" fill="#777777">2026-04</text>

  <line x1="575" y1="240" x2="575" y2="290" stroke="#999999" stroke-width="1"/>
  <circle cx="575" cy="240" r="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="575" y="304" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">OpenAI</text>
  <text x="575" y="315" text-anchor="middle" font-size="8" fill="#555555">自动化研究实习生达成</text>
  <text x="575" y="325" text-anchor="middle" font-size="8" fill="#777777">2026-09</text>

  <line x1="665" y1="240" x2="665" y2="330" stroke="#999999" stroke-width="1"/>
  <circle cx="665" cy="240" r="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="665" y="344" text-anchor="middle" font-size="9" font-weight="bold" fill="#111111">AISI 自我复制</text>
  <text x="665" y="355" text-anchor="middle" font-size="8" fill="#555555">5% → 60%（两年）</text>
  <text x="665" y="365" text-anchor="middle" font-size="8" fill="#777777">2025-12</text>

  <!-- Counter-evidence callout -->
  <rect x="55" y="385" width="690" height="62" fill="#f7f7f7" stroke="#111111" stroke-width="1.5"/>
  <text x="400" y="403" text-anchor="middle" font-size="10" font-weight="bold" fill="#111111">同时存在的反向证据 / Counter-evidence at the same time</text>
  <text x="400" y="419" text-anchor="middle" font-size="9" fill="#333333">Anthropic：截至 2026-05，超过 80% 合并进代码库的代码由 Claude 编写</text>
  <text x="400" y="432" text-anchor="middle" font-size="9" fill="#333333">影子评测（arXiv:2607.27191）：智能体完成全部工程，但对研究问题毫无进展，两篇论文被拒</text>
  <text x="400" y="443" text-anchor="middle" font-size="8" fill="#777777">Agents completed all the engineering, yet made no substantial progress on the research questions — both papers rejected</text>
</svg>