<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1a1a1a">图 2 · 自改进闭环与元层可编辑性</text>
  <text x="24" y="46" font-size="11" fill="#5a5a5a" font-style="italic">The Self-Improvement Loop and Meta-Layer Editability</text>
  <text x="24" y="76" font-size="11.5" font-weight="700" fill="#1a1a1a">L3 及以下：改进机制固定</text>
  <text x="24" y="91" font-size="9.5" fill="#5a5a5a" font-style="italic">mechanism fixed</text>
  <text x="396" y="76" font-size="11.5" font-weight="700" fill="#1a1a1a">L4 及以上：改进机制进入搜索空间</text>
  <text x="396" y="91" font-size="9.5" fill="#5a5a5a" font-style="italic">mechanism itself enters the search space</text>
  <rect x="56" y="120" width="120" height="50" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="116" y="141" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">档案 A</text>
    <text x="116" y="157" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Archive</text>
  <rect x="56" y="212" width="120" height="50" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="116" y="233" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">代理 B</text>
    <text x="116" y="249" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Agent (被改进)</text>
  <rect x="56" y="304" width="120" height="50" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="116" y="325" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">外部基准 C</text>
    <text x="116" y="341" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Fixed verifier</text>
  <path d="M 116 170 L 116 210" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <path d="M 116 210 L 112 202 L 120 202 Z" fill="#1a1a1a"/>
  <path d="M 116 262 L 116 302" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <path d="M 116 302 L 112 294 L 120 294 Z" fill="#1a1a1a"/>
