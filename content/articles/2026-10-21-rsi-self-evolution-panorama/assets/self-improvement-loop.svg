  <path d="M 54 145 L 46 139 L 46 151 Z" fill="#1a1a1a"/>
  <text x="36" y="240" font-size="9" fill="#5a5a5a" text-anchor="middle" transform="rotate(-90 36 240)">改进被保留</text>
  <rect x="212" y="112" width="140" height="252" fill="#f4f4f4" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="282" y="138" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">档案层</text>
    <text x="282" y="154" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Archive layer</text>
    <line x1="226" y1="168" x2="338" y2="168" stroke="#c0c0c0" stroke-width="0.8"/>
    <text x="282" y="190" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">两个系统共同具备</text>
    <text x="282" y="214" font-size="9" fill="#5a5a5a" text-anchor="middle">DGM 累积全部变体</text>
    <text x="282" y="236" font-size="9" fill="#5a5a5a" text-anchor="middle">AlphaEvolve MAP-Elites</text>
    <text x="282" y="258" font-size="9" fill="#5a5a5a" text-anchor="middle">RQGM UCB-Air</text>
    <text x="282" y="272" font-size="9" fill="#5a5a5a" text-anchor="middle">+ 选择性擦除</text>
    <line x1="226" y1="288" x2="338" y2="288" stroke="#c0c0c0" stroke-width="0.8"/>
    <text x="282" y="310" font-size="9.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">← 条件 C 成立</text>
    <text x="282" y="330" font-size="9" fill="#5a5a5a" text-anchor="middle">recursive retention</text>
  <rect x="396" y="120" width="118" height="50" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="455" y="141" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">档案 D</text>
    <text x="455" y="157" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Archive</text>
  <rect x="562" y="120" width="122" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
    <text x="623" y="141" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">元代理 E</text>
    <text x="623" y="157" font-size="9.5" fill="#8b3a3a" text-anchor="middle">Meta-agent (可编辑)</text>
  <rect x="479" y="212" width="118" height="50" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.2"/>
    <text x="538" y="233" font-size="10.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">任务代理 F</text>
    <text x="538" y="249" font-size="9.5" fill="#5a5a5a" text-anchor="middle">Task agent</text>
  <rect x="479" y="304" width="118" height="50" fill="#ffffff" stroke="#8b3a3a" stroke-width="1.6"/>
    <text x="538" y="325" font-size="10.5" font-weight="700" fill="#8b3a3a" text-anchor="middle">评估器 G</text>
    <text x="538" y="341" font-size="9.5" fill="#8b3a3a" text-anchor="middle">Evaluator (共演化)</text>
  <path d="M 514 145 L 560 145" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <path d="M 560 145 L 552 140 L 552 150 Z" fill="#1a1a1a"/>
  <path d="M 623 170 L 623 192 L 538 192 L 538 210" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
  <path d="M 538 210 L 534 202 L 542 202 Z" fill="#1a1a1a"/>
  <path d="M 538 262 L 538 302" fill="none" stroke="#8b3a3a" stroke-width="1.3"/>
  <path d="M 538 302 L 534 294 L 542 294 Z" fill="#8b3a3a"/>
  <path d="M 597 304 L 597 288 L 455 288 L 455 172" fill="none" stroke="#8b3a3a" stroke-width="1.3" stroke-dasharray="5 3"/>
  <path d="M 455 172 L 451 180 L 459 180 Z" fill="#8b3a3a"/>
  <path d="M 176 145 L 210 145" fill="none" stroke="#5a5a5a" stroke-width="1.2"/>
  <text x="696" y="222" font-size="9.5" fill="#1a1a1a">HyperAgents：</text>
  <text x="696" y="237" font-size="9.5" fill="#1a1a1a">任务代理与元代理</text>
  <text x="696" y="252" font-size="9.5" fill="#1a1a1a">集成于单个</text>
  <text x="696" y="267" font-size="9.5" fill="#1a1a1a">可编辑程序</text>
  <text x="696" y="284" font-size="8.5" fill="#5a5a5a">arXiv:2603.19461</text>
  <text x="623" y="378" font-size="9.5" fill="#8b3a3a" text-anchor="middle">红色路径 = 验证器本身也在漂移</text>
  <text x="623" y="391" font-size="9" fill="#8b3a3a" text-anchor="middle">the verifier itself drifts</text>
  <line x1="24" y1="412" x2="776" y2="412" stroke="#e0e0e0" stroke-width="1"/>
  <text x="24" y="432" font-size="9.5" fill="#5a5a5a">竞争焦点已从「代理能解什么题」转向「系统能否改进自己的改进过程」——正是第 0 部分 L3 → L4 的跨越。</text>
  <text x="24" y="447" font-size="8.5" fill="#5a5a5a">Competition has shifted from what problems an agent can solve to whether a system can improve its own process of improvement — the L3 to L4 transition of Part 0.</text>
</svg>