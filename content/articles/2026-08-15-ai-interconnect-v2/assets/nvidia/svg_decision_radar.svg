<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">9 方案 × 5 维决策雷达图（基于表 §12.1）</text>
<text x="400" y="46" text-anchor="middle" font-size="11" fill="#525252">覆盖：性能 / 容量 / 生态 / 自主 / 成本 · 数值越大越接近满分 10</text>

<!-- 雷达图位置: center (400, 270), radii 30/60/90/120 -->
<g>
  <!-- 5 维等距分布 -->
  <!-- 0: 性能 (top), 1: 容量 (upper-right), 2: 生态 (lower-right), 3: 自主 (lower-left), 4: 成本 (upper-left) -->
  <circle cx="400" cy="270" r="40" fill="none" stroke="#a3a3a3" stroke-width="0.4"/>
  <circle cx="400" cy="270" r="80" fill="none" stroke="#a3a3a3" stroke-width="0.4"/>
  <circle cx="400" cy="270" r="120" fill="none" stroke="#a3a3a3" stroke-width="0.4"/>

  <!-- 5 维轴线 -->
  <g stroke="#525252" stroke-width="0.6">
    <line x1="400" y1="270" x2="400" y2="150"/>
    <line x1="400" y1="270" x2="504" y2="210"/>
    <line x1="400" y1="270" x2="504" y2="330"/>
    <line x1="400" y1="270" x2="296" y2="330"/>
    <line x1="400" y1="270" x2="296" y2="210"/>
  </g>

  <!-- 5 维标签 -->
  <g font-size="11" font-weight="700" fill="#0a0a0a">
    <text x="400" y="142" text-anchor="middle">性能</text>
    <text x="528" y="212" text-anchor="start">容量</text>
    <text x="528" y="338" text-anchor="start">生态</text>
    <text x="272" y="338" text-anchor="end">自主</text>
    <text x="272" y="212" text-anchor="end">成本</text>
  </g>

  <!-- 数字刻度 -->
  <g font-size="9" fill="#525252">
    <text x="405" y="195">4</text>
    <text x="405" y="155">8</text>
  </g>

  <!-- 9 方案数据 (性能/容量/生态/自主/成本) -->
  <!-- CMX: 10/9/8/2/5 -->
  <polygon points="400,150 504,210 480,294 344,294 320,238" fill="#0a0a0a" fill-opacity="0.15" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="400" cy="150" r="3" fill="#0a0a0a"/>
  <circle cx="504" cy="210" r="3" fill="#0a0a0a"/>
  <circle cx="480" cy="294" r="3" fill="#0a0a0a"/>
  <circle cx="344" cy="294" r="3" fill="#0a0a0a"/>
  <circle cx="320" cy="238" r="3" fill="#0a0a0a"/>
  <text x="410" y="135" font-size="10" font-weight="700" fill="#0a0a0a">NVIDIA CMX (10/9/8/2/5)</text>

  <!-- CXL: 6/10/7/3/7 -->
  <polygon points="376,222 504,210 472,302 360,302 320,238" fill="#3f3f46" fill-opacity="0.15" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="655" y="190" font-size="10" font-weight="700" fill="#3f3f46">CXL 池化 (6/10/7/3/7)</text>

  <!-- 灵衢: 9/7/4/9/6 -->
  <polygon points="392,166 472,234 472,302 296,330 320,238" fill="#71717a" fill-opacity="0.15" stroke="#71717a" stroke-width="1.5"/>
  <text x="155" y="285" font-size="10" font-weight="700" fill="#71717a">华为灵衢 (9/7/4/9/6)</text>

  <!-- TPU: 9/6/7/4/5 -->
  <polygon points="392,166 456,234 472,302 360,302 320,238" fill="#a3a3a3" fill-opacity="0.15" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="155" y="350" font-size="10" font-weight="700" fill="#525252">TPU prefix (9/6/7/4/5)</text>

  <!-- FlashKV: 5/8/4/10/9 -->
  <polygon points="408,222 504,210 432,326 296,330 280,222" fill="#d4d4d8" fill-opacity="0.15" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="155" y="200" font-size="10" font-weight="700" fill="#71717a">阿里 FlashKV (5/8/4/10/9)</text>

  <!-- NVLink: 10/4/9/2/3 -->
  <polygon points="400,150 440,234 480,294 360,302 320,238" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="655" y="320" font-size="10" font-weight="700" fill="#525252">NVLink (10/4/9/2/3)</text>

  <!-- UALink: 7/7/6/5/7 -->
  <polygon points="384,190 480,234 472,302 360,302 320,238" fill="none" stroke="#525252" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="655" y="100" font-size="10" font-weight="700" fill="#525252">UALink (7/7/6/5/7)</text>

  <!-- Ultra Eth: 6/8/7/4/8 -->
  <polygon points="408,222 488,210 472,302 360,302 304,226" fill="none" stroke="#a3a3a3" stroke-width="1"/>
  <text x="655" y="140" font-size="10" font-weight="700" fill="#a3a3a3">Ultra Eth (6/8/7/4/8)</text>

  <!-- PCIe 7: 8/3/9/5/9 -->
  <polygon points="384,190 432,250 480,294 360,302 304,226" fill="none" stroke="#a3a3a3" stroke-width="1"/>
  <text x="655" y="250" font-size="10" font-weight="700" fill="#a3a3a3">PCIe 7 (8/3/9/5/9)</text>
</g>

<!-- 底部 -->
<text x="400" y="430" text-anchor="middle" font-size="9" fill="#525252">数据来源：§12.1 5 维评分矩阵（0-10 分）· 数据截至 2026-07</text>
<text x="400" y="446" text-anchor="middle" font-size="9" fill="#525252">解读：CMX 性能/容量满分但成本/自主低，灵衢自主高但生态弱，TPU 平衡</text>
</svg>