<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="ui-sans-serif,system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">扩展互联协议对比：UALink 1.0 / Ultra Ethernet / PCIe 7.0</text>
<text x="400" y="46" text-anchor="middle" font-size="11" fill="#525252">三类互联协议在带宽、延迟、拓扑、内存语义维度对比</text>

<!-- 顶部图例 -->
<g font-size="10" fill="#525252">
  <rect x="80" y="60" width="14" height="14" fill="#0a0a0a"/><text x="100" y="71">UALink 1.0</text>
  <rect x="220" y="60" width="14" height="14" fill="#3f3f46"/><text x="240" y="71">Ultra Ethernet</text>
  <rect x="380" y="60" width="14" height="14" fill="#a3a3a3"/><text x="400" y="71">PCIe 7.0</text>
  <rect x="490" y="60" width="14" height="14" fill="#fff" stroke="#0a0a0a" stroke-width="0.5" stroke-dasharray="2 2"/><text x="510" y="71">优势维度</text>
</g>

<!-- 表头 -->
<g>
  <rect x="40" y="90" width="720" height="32" fill="#0a0a0a"/>
  <text x="60" y="111" font-size="11" font-weight="700" fill="#fff">维度</text>
  <text x="220" y="111" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">UALink 1.0</text>
  <text x="420" y="111" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Ultra Ethernet</text>
  <text x="620" y="111" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">PCIe 7.0</text>
</g>

<!-- 维度: 单通道带宽 -->
<g>
  <rect x="40" y="122" width="720" height="40" fill="#fff" stroke="#525252" stroke-width="0.5"/>
  <text x="60" y="146" font-size="10" fill="#0a0a0a">单通道带宽</text>
  <rect x="220" y="132" width="180" height="22" fill="#0a0a0a"/>
  <text x="310" y="147" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">200 Gbps ×16 = 3.2 T</text>
  <rect x="420" y="132" width="180" height="22" fill="#3f3f46"/>
  <text x="510" y="147" text-anchor="middle" font-size="10" fill="#fff">200 Gbps 单端口</text>
  <rect x="620" y="132" width="120" height="22" fill="#a3a3a3"/>
  <text x="680" y="147" text-anchor="middle" font-size="10" fill="#0a0a0a" font-weight="700">128 GT/s ×16</text>
</g>

<!-- 维度: 端到端延迟 -->
<g>
  <rect x="40" y="162" width="720" height="40" fill="#fafafa" stroke="#525252" stroke-width="0.5"/>
  <text x="60" y="186" font-size="10" fill="#0a0a0a">端到端延迟</text>
  <rect x="220" y="172" width="180" height="22" fill="#0a0a0a"/>
  <text x="310" y="187" text-anchor="middle" font-size="10" fill="#fff">~2 μs 内存语义</text>
  <rect x="420" y="172" width="180" height="22" fill="#3f3f46"/>
  <text x="510" y="187" text-anchor="middle" font-size="10" fill="#fff">~5 μs RDMA</text>
  <rect x="620" y="172" width="120" height="22" fill="#a3a3a3"/>
  <text x="680" y="187" text-anchor="middle" font-size="10" fill="#0a0a0a">~数百 ns 短距</text>
</g>

<!-- 维度: 拓扑 -->
<g>
  <rect x="40" y="202" width="720" height="40" fill="#fff" stroke="#525252" stroke-width="0.5"/>
  <text x="60" y="226" font-size="10" fill="#0a0a0a">拓扑</text>
  <rect x="220" y="212" width="180" height="22" fill="#0a0a0a"/>
  <text x="310" y="227" text-anchor="middle" font-size="10" fill="#fff">环形 / 树形 ≤ 1024</text>
  <rect x="420" y="212" width="180" height="22" fill="#3f3f46"/>
  <text x="510" y="227" text-anchor="middle" font-size="10" fill="#fff">Fat-Tree 全网状</text>
  <rect x="620" y="212" width="120" height="22" fill="#a3a3a3"/>
  <text x="680" y="227" text-anchor="middle" font-size="10" fill="#0a0a0a">点对点星型</text>
</g>

<!-- 维度: 内存语义 -->
<g>
  <rect x="40" y="242" width="720" height="40" fill="#fafafa" stroke="#525252" stroke-width="0.5"/>
  <text x="60" y="266" font-size="10" fill="#0a0a0a">内存语义</text>
  <rect x="220" y="252" width="180" height="22" fill="#0a0a0a"/>
  <text x="310" y="267" text-anchor="middle" font-size="10" fill="#fff">原生 Load/Store</text>
  <rect x="420" y="252" width="180" height="22" fill="#3f3f46"/>
  <text x="510" y="267" text-anchor="middle" font-size="10" fill="#fff">RDMA 一致性</text>
  <rect x="620" y="252" width="120" height="22" fill="#a3a3a3"/>
  <text x="680" y="267" text-anchor="middle" font-size="10" fill="#0a0a0a">DMA + P2P</text>
</g>

<!-- 维度: 最大规模 -->
<g>
  <rect x="40" y="282" width="720" height="40" fill="#fff" stroke="#525252" stroke-width="0.5"/>
  <text x="60" y="306" font-size="10" fill="#0a0a0a">最大规模</text>
  <rect x="220" y="292" width="180" height="22" fill="#0a0a0a"/>
  <text x="310" y="307" text-anchor="middle" font-size="10" fill="#fff">10 万级加速器</text>
  <rect x="420" y="292" width="180" height="22" fill="#3f3f46"/>
  <text x="510" y="307" text-anchor="middle" font-size="10" fill="#fff">10 万 + 端口</text>
  <rect x="620" y="292" width="120" height="22" fill="#a3a3a3"/>
  <text x="680" y="307" text-anchor="middle" font-size="10" fill="#0a0a0a">单域 ≤ 256 节点</text>
</g>

<!-- 维度: 主要生态 -->
<g>
  <rect x="40" y="322" width="720" height="40" fill="#fafafa" stroke="#525252" stroke-width="0.5"/>
  <text x="60" y="346" font-size="10" fill="#0a0a0a">主要生态</text>
  <rect x="220" y="332" width="180" height="22" fill="#0a0a0a"/>
  <text x="310" y="347" text-anchor="middle" font-size="10" fill="#fff">Intel / AMD / Meta</text>
  <rect x="420" y="332" width="180" height="22" fill="#3f3f46"/>
  <text x="510" y="347" text-anchor="middle" font-size="10" fill="#fff">Linux 基金会 / UEC</text>
  <rect x="620" y="332" width="120" height="22" fill="#a3a3a3"/>
  <text x="680" y="347" text-anchor="middle" font-size="10" fill="#0a0a0a">PCI-SIG 全员</text>
</g>

<!-- 维度: 适用场景 -->
<g>
  <rect x="40" y="362" width="720" height="50" fill="#fff" stroke="#525252" stroke-width="0.5"/>
  <text x="60" y="386" font-size="10" fill="#0a0a0a">适用场景</text>
  <text x="310" y="380" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">机柜内 / 集群内</text>
  <text x="310" y="398" text-anchor="middle" font-size="9" fill="#525252">内存池化 KV 直达</text>
  <text x="510" y="380" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">超大规模推理网</text>
  <text x="510" y="398" text-anchor="middle" font-size="9" fill="#525252">RDMA + 集合通信</text>
  <text x="680" y="380" text-anchor="middle" font-size="9" fill="#0a0a0a" font-weight="700">板内 / 短距</text>
  <text x="680" y="398" text-anchor="middle" font-size="9" fill="#525252">CPU/GPU 直连</text>
</g>

<!-- 底部结论 -->
<g>
  <rect x="40" y="424" width="720" height="22" fill="#fafafa" stroke="#0a0a0a" stroke-width="0.7"/>
  <text x="400" y="439" text-anchor="middle" font-size="10" fill="#0a0a0a" font-weight="700">结论：三者在 AI 算力网中互补 — UALink 内存语义 + Ultra Ethernet 广域 RDMA + PCIe 7.0 板内</text>
</g>
</svg>
