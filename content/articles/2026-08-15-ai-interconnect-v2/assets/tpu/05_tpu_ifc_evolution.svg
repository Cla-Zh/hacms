<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="PingFang SC,Microsoft YaHei,sans-serif">
<rect width="800" height="460" fill="#fff"/>
<text x="400" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#0a0a0a">TPU ICI 历代演进 (v2 → v6 Trillium)</text>
<text x="400" y="50" text-anchor="middle" font-size="11" fill="#525252">Inter-Chip Interconnect 16 年演进 · 2D mesh → 3D torus → OCS → Trillium 双向带宽</text>
<g transform="translate(40,90)">
<line x1="0" y1="60" x2="720" y2="60" stroke="#0a0a0a" stroke-width="2"/>
<circle cx="20" cy="60" r="7" fill="#0a0a0a"/>
<text x="20" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">v2</text>
<text x="20" y="84" text-anchor="middle" font-size="10" fill="#525252">2017</text>
<text x="20" y="100" text-anchor="middle" font-size="10" fill="#0a0a0a">2D mesh</text>
<text x="20" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">256 GB/s</text>
<text x="20" y="132" text-anchor="middle" font-size="9" fill="#525252">256 chip</text>
<text x="20" y="146" text-anchor="middle" font-size="9" fill="#525252">Mesh 拓扑</text>
<circle cx="150" cy="60" r="7" fill="#0a0a0a"/>
<text x="150" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">v3</text>
<text x="150" y="84" text-anchor="middle" font-size="10" fill="#525252">2018</text>
<text x="150" y="100" text-anchor="middle" font-size="10" fill="#0a0a0a">2D torus</text>
<text x="150" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">656 GB/s</text>
<text x="150" y="132" text-anchor="middle" font-size="9" fill="#525252">1024 chip</text>
<text x="150" y="146" text-anchor="middle" font-size="9" fill="#525252">4× Pod 4 子片</text>
<circle cx="280" cy="60" r="7" fill="#0a0a0a"/>
<text x="280" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">v4</text>
<text x="280" y="84" text-anchor="middle" font-size="10" fill="#525252">2021</text>
<text x="280" y="100" text-anchor="middle" font-size="10" fill="#0a0a0a">3D torus+OCS</text>
<text x="280" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">600 GB/s</text>
<text x="280" y="132" text-anchor="middle" font-size="9" fill="#525252">4096 chip</text>
<text x="280" y="146" text-anchor="middle" font-size="9" fill="#525252">OCS MEMS 1.0</text>
<circle cx="410" cy="60" r="7" fill="#0a0a0a"/>
<text x="410" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">v5e</text>
<text x="410" y="84" text-anchor="middle" font-size="10" fill="#525252">2023</text>
<text x="410" y="100" text-anchor="middle" font-size="10" fill="#0a0a0a">2D torus</text>
<text x="410" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">186 GB/s</text>
<text x="410" y="132" text-anchor="middle" font-size="9" fill="#525252">256 chip</text>
<text x="410" y="146" text-anchor="middle" font-size="9" fill="#525252">推理优化</text>
<circle cx="540" cy="60" r="7" fill="#0a0a0a"/>
<text x="540" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">v5p</text>
<text x="540" y="84" text-anchor="middle" font-size="10" fill="#525252">2023</text>
<text x="540" y="100" text-anchor="middle" font-size="10" fill="#0a0a0a">2D torus</text>
<text x="540" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">480 GB/s</text>
<text x="540" y="132" text-anchor="middle" font-size="9" fill="#525252">8960 chip</text>
<text x="540" y="146" text-anchor="middle" font-size="9" fill="#525252">训练优化</text>
<circle cx="670" cy="60" r="7" fill="#0a0a0a"/>
<text x="670" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#0a0a0a">v6</text>
<text x="670" y="84" text-anchor="middle" font-size="10" fill="#525252">2025</text>
<text x="670" y="100" text-anchor="middle" font-size="10" fill="#0a0a0a">2D torus</text>
<text x="670" y="116" text-anchor="middle" font-size="10" font-weight="700" fill="#0a0a0a">1024 GB/s</text>
<text x="670" y="132" text-anchor="middle" font-size="9" fill="#525252">256 chip</text>
<text x="670" y="146" text-anchor="middle" font-size="9" fill="#525252">Trillium 双向 ICI</text>
</g>
<g transform="translate(40,260)">
<rect x="0" y="0" width="720" height="160" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.5"/>
<text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">3 大设计转折点</text>
<text x="20" y="48" font-size="11" fill="#0a0a0a" font-weight="700">2018 v3 → 2D torus</text>
<text x="20" y="66" font-size="10" fill="#525252">Mesh 升级 torus, 边界 wrap 链路解决直径瓶颈, pod 扩 4× 至 1024 chip</text>
<text x="20" y="92" font-size="11" fill="#0a0a0a" font-weight="700">2021 v4 → 3D torus + OCS 1.0</text>
<text x="20" y="110" font-size="10" fill="#525252">引入 OCS MEMS 反射镜, 支持分组配置 + 故障片绕过, pod 扩 4× 至 4096 chip</text>
<text x="20" y="136" font-size="11" fill="#0a0a0a" font-weight="700">2025 v6 Trillium → 双向 ICI 1 TB/s</text>
<text x="20" y="154" font-size="10" fill="#525252">双向串行带宽首次突破 1 TB/s, 单 pod 256 chip 但 multislice 互连 4096+</text>
</g>
<rect x="0" y="430" width="800" height="30" fill="#0a0a0a"/>
<text x="400" y="450" text-anchor="middle" font-size="10" fill="#fff">数据源: Google ISCA 顶会论文 + Cloud 官方 TPU 规格 (2017-2025)</text>
</svg>