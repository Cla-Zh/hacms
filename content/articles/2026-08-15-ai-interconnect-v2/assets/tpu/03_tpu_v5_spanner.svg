<g transform="translate(480,80)">
<rect x="0" y="0" width="280" height="160" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.5"/>
<text x="140" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#0a0a0a">v5e vs v5p 关键差异</text>
<text x="14" y="48" font-size="10" fill="#0a0a0a">▸ ICI 带宽 186 vs 480 GB/s</text>
<text x="14" y="68" font-size="10" fill="#0a0a0a">▸ 规模 256 vs 8960 chip</text>
<text x="14" y="88" font-size="10" fill="#0a0a0a">▸ HBM 16 vs 80 GB</text>
<text x="14" y="108" font-size="10" fill="#0a0a0a">▸ 功耗 100 vs 200 W</text>
<text x="14" y="128" font-size="10" fill="#0a0a0a">▸ 部署 2023 / 2023 H2</text>
<text x="14" y="148" font-size="10" fill="#0a0a0a">▸ Spanner 协议统一调度</text>
</g>
<g transform="translate(40,260)">
<rect x="0" y="0" width="720" height="150" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.5"/>
<text x="360" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#0a0a0a">Spanner 切片协同协议</text>
<text x="20" y="48" font-size="11" fill="#0a0a0a">▸ Spanner = TPU 5 引入的 ICI 调度协议, 关联多个 2D torus 切片</text>
<text x="20" y="68" font-size="11" fill="#0a0a0a">▸ v5p 14 slices × 16×16 chip = 3584 chip / pod, multislice 4096 chip</text>
<text x="20" y="88" font-size="11" fill="#0a0a0a">▸ Spanner 提供统一调度, 让跨切片作业像单一 pod 一样运行</text>
<text x="20" y="108" font-size="11" fill="#0a0a0a">▸ 配合 DCN 互联 (Pod ↔ Pod, 50-100 GB/s 跨数据中心), 扩 8960 chip</text>
<text x="20" y="128" font-size="11" fill="#0a0a0a">▸ v5e 廉价版 ICI 减半, 推理重用, 256 chip 已可服务 200B 模型</text>
</g>
<rect x="0" y="430" width="800" height="30" fill="#0a0a0a"/>
<text x="400" y="450" text-anchor="middle" font-size="10" fill="#fff">源: Google Cloud TPU v5 官方 + Hot Chips 2023</text>
